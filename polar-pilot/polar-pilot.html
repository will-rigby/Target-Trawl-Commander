    function wrapText(text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let line = "";
      for (const word of words) {
        const test = line ? line + " " + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function onKey(event, pressed) {
      const code = event.code;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
           "KeyA", "KeyD", "KeyW", "KeyS", "KeyE", "KeyH", "Space",
           "Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6"].includes(code)) {
        event.preventDefault();
      }
      if (/^Digit[1-6]$/.test(code) && pressed && !event.repeat) {
        startLevel(parseInt(code.slice(5), 10) - 1, false);
      } else if (code === "ArrowLeft" || code === "KeyA") input.left = pressed;
      else if (code === "ArrowRight" || code === "KeyD") input.right = pressed;
      else if (code === "ArrowUp" || code === "KeyW") input.up = pressed;
      else if (code === "ArrowDown" || code === "KeyS") input.down = pressed;
      else if (code === "KeyH" && pressed && !event.repeat && gameState === "playing") {
        setAutoHover(!autoHoverEnabled);
      }
      else if (code === "KeyE" && pressed && !event.repeat) handleLoadKey();
      else if (code === "Space") {
        if (gameState === "playing") input.level = pressed;
        if (pressed && !event.repeat) {
          if (gameState === "title") {
            startLevel(0, false);
          } else if (gameState === "briefing") {
            gameState = "playing";
          } else if (gameState === "crashed") {
            resetLevel("playing");
          } else if (gameState === "levelComplete") {
            if (levelIndex < LEVELS.length - 1) startLevel(levelIndex + 1, false);
            else gameState = "gameComplete";
          } else if (gameState === "gameComplete") {
            resetGame(false);
          }
        }
      }
    }

    window.addEventListener("keydown", event => onKey(event, true), { passive: false });
    window.addEventListener("keyup", event => onKey(event, false), { passive: false });
    canvas.addEventListener("pointermove", aimSpotlight, { passive: true });
    window.addEventListener("blur", clearInput);
    window.addEventListener("resize", resizeCanvas);

    function frame(now) {
      const realDt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
      lastFrame = now;
      accumulator += realDt;
      while (accumulator >= FIXED_DT) {
        stepPhysics(FIXED_DT);
        updateCamera(FIXED_DT);
        accumulator -= FIXED_DT;
      }
      ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
      ctx.clearRect(0, 0, viewWidth, viewHeight);
      drawWorld(realDt);
      drawHUD();
      drawObjectivePointer();
      if (gameState === "title") drawTitle();
      else if (gameState === "briefing") drawBriefing();
      else if (gameState === "crashed") drawCrash();
      else if (gameState === "levelComplete") drawLevelComplete();
      else if (gameState === "gameComplete") drawGameComplete();
      if (!testMode) requestAnimationFrame(frame);
    }

    function simulateFrames(count) {
      for (let i = 0; i < count; i++) stepPhysics(FIXED_DT);
    }

    function setAirborne(x, y, collective) {
      helicopter.x = x;
      helicopter.y = y;
      helicopter.vx = 0;
      helicopter.vy = 0;
      helicopter.angle = 0;
      helicopter.targetAngle = 0;
      helicopter.angularVelocity = 0;
      helicopter.collective = collective;
      helicopter.landed = false;
      helicopter.landedAt = "";
      helicopter.landedSurface = null;
      helicopter.facing = 1;
      autoHoverEnabled = false;
      autoHoverTargetAltitude = helicopter.y;
      gameState = "playing";
      clearInput();
    }

    function runSelfTests() {
      testMode = true;
      const result = {};

      resetGame(true);
      input.right = true;
      simulateFrames(60);
      result.landedCyclicPivots = helicopter.angle > 0.04 &&
        helicopter.angle <= SKID_PIVOT_MAX_ANGLE + 0.01;
      input.right = false;
      simulateFrames(120);
      result.landedCyclicReturnsLevel = Math.abs(helicopter.angle) < 0.02 &&
        Math.abs(helicopter.angularVelocity) < 0.02;
      result.svgShipGeometry = NUYINA_SVG_WIDTH === 160 &&
        Math.abs((SHIP_DECK.x1 + SHIP_DECK.x2) / 2 - 134) < 0.001 &&
        Math.abs(SHIP_DECK.y - 13.488146) < 0.001 &&
        PALLET_PICKUP_X >= SHIP_CARGO_PAD.x1 && PALLET_PICKUP_X <= SHIP_CARGO_PAD.x2;
      result.slingRouteIsShort = Math.abs(
        (CARGO_ZONE.x1 + CARGO_ZONE.x2) / 2 - PALLET_PICKUP_X
      ) >= 280 && Math.abs((CARGO_ZONE.x1 + CARGO_ZONE.x2) / 2 - PALLET_PICKUP_X) <= 330;

      resetGame(true);
      helicopter.collective = 0.78;
      input.right = true;
      simulateFrames(20);
      result.tiltedSkidTakeoff = !helicopter.landed && gameState === "playing" &&
        Math.abs(helicopter.angle) <= SKID_PIVOT_MAX_ANGLE + 0.08;

      setAirborne((SHIP_DECK.x1 + SHIP_DECK.x2) / 2, SHIP_DECK_Y + SKID_DROP + 0.01, 0.3);
      helicopter.angle = 8 * Math.PI / 180;
      helicopter.vy = -1;
      stepPhysics(FIXED_DT);
      result.tiltedDeckLanding = helicopter.landed && gameState === "playing" &&
        Math.abs(helicopter.angle) <= SKID_CONTACT_MAX_ANGLE;

      resetGame(true);
      input.up = true;
      simulateFrames(60);
      input.up = false;
      result.collectiveRaised = Math.round(helicopter.collective * 100);
      const heldCollective = helicopter.collective;
      simulateFrames(45);
      result.collectivePersists = Math.abs(helicopter.collective - heldCollective) < 0.0001;

      setAirborne(600, 40, 0.76);
      const climbStart = helicopter.y;
      simulateFrames(120);
      result.climbed = Math.round((helicopter.y - climbStart) * 10) / 10;

      setAirborne(700, 85, 0.62);
      input.right = true;
      simulateFrames(30);
      input.right = false;
      const heldTarget = helicopter.targetAngle;
      simulateFrames(90);
      result.heldAngleDeg = Math.round(helicopter.angle * 180 / Math.PI);
      result.angleHeld = Math.abs(helicopter.angle - heldTarget) < 0.02;
      result.forwardTravel = Math.round((helicopter.x - 700) * 10) / 10;

      setAirborne(700, 500, 0.72);
      input.right = true;
      simulateFrames(180);
      input.right = false;
      result.unlimitedAngleDeg = Math.round(helicopter.angle * 180 / Math.PI);
      input.level = true;
      simulateFrames(150);
      input.level = false;
      result.spaceLevelledDeg =
        Math.round(Math.abs(helicopter.angle * 180 / Math.PI) * 10) / 10;

      setAirborne(700, 100, 0.62);
      const hoverStartAltitude = helicopter.y;
      onKey(
        { code: "KeyH", repeat: false, preventDefault: function() {} },
        true
      );
      result.autoHoverEnabled = autoHoverEnabled &&
        Math.abs(autoHoverTargetAltitude - hoverStartAltitude) < 0.001;
      input.right = true;
      simulateFrames(180);
      input.right = false;
      result.autoHoverPitchCapped =
        Math.abs(helicopter.angle) <= AUTO_HOVER_MAX_TILT + 0.02;

      setAirborne(700, 100, 0.62);
      setAutoHover(true);
      helicopter.vx = 8;
      simulateFrames(600);
      result.autoHoverBrakes = Math.abs(helicopter.vx) < 0.5;
      result.autoHoverLevels = Math.abs(helicopter.angle) < 0.02;
      const targetBeforeClimb = autoHoverTargetAltitude;
      input.up = true;
      simulateFrames(60);
      input.up = false;
      simulateFrames(240);
      result.autoHoverClimbTarget = autoHoverTargetAltitude >= targetBeforeClimb + 6.9;
      result.autoHoverAltitudeHeld =
        Math.abs(helicopter.y - autoHoverTargetAltitude) < 2;

      result.pressureThrustDrops =
        availableLiftAccelerationAt(5000) < availableLiftAccelerationAt(0);
      setAirborne(700, 5000, 1);
      const highAltitudeStart = helicopter.y;
      simulateFrames(300);
      result.highAltitudeCannotHover = helicopter.y < highAltitudeStart - 1;

      setAirborne(700, 100, 0.56);
      helicopter.vx = 0.6;
      stepPhysics(FIXED_DT);
      result.lowSpeedSettles = helicopter.vx === 0;

      setAirborne(700, 100, 0.62);
      helicopter.vx = -DIRECTION_FLIP_SPEED - 1;
      stepPhysics(FIXED_DT);
      result.facesLeftInReverse = helicopter.facing === -1;
      helicopter.vx = DIRECTION_FLIP_SPEED + 1;
      stepPhysics(FIXED_DT);
      result.facesRightForward = helicopter.facing === 1;

      setAirborne(134, SHIP_DECK_Y + SKID_DROP + 0.01, 0.3);
      helicopter.vy = -2;
      stepPhysics(FIXED_DT);
      result.safeLanding = helicopter.landed && gameState === "playing";

      setAirborne(134, SHIP_DECK_Y + SKID_DROP + 0.01, 0.3);
      helicopter.vy = -5;
      stepPhysics(FIXED_DT);
      result.hardLandingCrash = gameState === "crashed";

      setAirborne(500, SKID_DROP + 0.01, 0.2);
      helicopter.vy = -4;
      stepPhysics(FIXED_DT);
      result.waterCrash = gameState === "crashed" && crashReason.indexOf("Water") === 0;

      startLevel(1, true);
      const terrainX = 580;
      setAirborne(terrainX, terrainHeightAt(terrainX) + SKID_DROP + 0.01, 0.3);
      helicopter.vy = -2;
      stepPhysics(FIXED_DT);
      result.terrainSkidLanding = helicopter.landed && helicopter.landedSurface.kind === "terrain";

      startLevel(1, true);
      const roof = BUILDINGS[0];
      setAirborne((roof.x1 + roof.x2) / 2, roof.y2 + SKID_DROP + 0.01, 0.3);
      helicopter.vy = -2;
      stepPhysics(FIXED_DT);
      result.roofSkidLanding = helicopter.landed && helicopter.landedSurface.kind === "roof";

      startLevel(0, true);
      icebergScouted = true;
      const workingDeckX = SHIP_EXPOSED_DECK.x1 + 6;
      setAirborne(workingDeckX, shipDeckY() + SKID_DROP + 0.01, 0.3);
      helicopter.vy = -2;
      stepPhysics(FIXED_DT);
      result.exposedDeckSkidLanding = helicopter.landed &&
        helicopter.landedSurface.kind === "shipDeck" && gameState === "playing";

      startLevel(1, true);
      const collisionTerrainY = terrainHeightAt(terrainX);
      setAirborne(terrainX, collisionTerrainY + 1.52, 0.3);
      helicopter.angle = 25 * Math.PI / 180;
      checkContact(helicopterPose());
      result.cockpitTerrainCrash = gameState === "crashed" && crashReason.indexOf("Cockpit or rotor") === 0;

      startLevel(1, true);
      setAirborne(terrainX, collisionTerrainY + 0.44, 0.3);
      helicopter.angle = 25 * Math.PI / 180;
      checkContact(helicopterPose());
      result.mainRotorTerrainCrash = gameState === "crashed" && crashReason.indexOf("Cockpit or rotor") === 0;

      startLevel(1, true);
      setAirborne(terrainX, collisionTerrainY + 2.7, 0.3);
      helicopter.angle = -25 * Math.PI / 180;
      checkContact(helicopterPose());
      result.tailRotorTerrainCrash = gameState === "crashed" && crashReason.indexOf("Cockpit or rotor") === 0;

      result.shipProfileDeck = Math.abs(shipSolidHeightAt(SHIP_EXPOSED_DECK.x1 + 8) - shipDeckY()) < 0.02;
      result.shipProfileSuperstructure = shipSolidHeightAt(NUYINA_WORLD_X + 60) > shipDeckY() + 10;
      result.shipProfileNoPhantomWall = shipSolidHeightAt(NUYINA_WORLD_X + 105) < shipDeckY() + 1;
      result.shipProfileBoundary = !Number.isFinite(shipSolidHeightAt(NUYINA_WORLD_X - 1));

      startLevel(0, true);
      setAirborne(SCOUT_X, SCOUT_PEAK_Y + 25, GRAVITY / MAX_LIFT_ACCEL);
      simulateFrames(30);
      result.scoutHoverProgress = isScoutHoverValid() && scoutTimer > 0;
      simulateFrames(Math.ceil(SCOUT_TIME / FIXED_DT) - 28);
      result.icebergScouted = icebergScouted;
      result.scoutRetargeted = activeObjective().x ===
        (SHIP_DECK.x1 + SHIP_DECK.x2) / 2;
      settleLanding(SHIP_DECK);
      result.scoutComplete = gameState === "levelComplete";

      startLevel(1, true);
      result.passengersLoaded = passengersAboard === 6;
      settleLanding(STATION_PAD);
      result.passengerComplete =
        gameState === "levelComplete" && passengersAboard === 0;

      startLevel(2, true);
      result.cargoZoneGrounded = Number.isFinite(cargoGroundY()) &&
        cargoGroundY() > 0;
      result.stationPadFlush = Math.abs(
        iceHeightAt((STATION_PAD.x1 + STATION_PAD.x2) / 2) - STATION_PAD.y
      ) < 0.001;
      setAirborne(
        PALLET_PICKUP_X + PALLET_WIDTH / 2,
        pallet.y + 1.3 + CABLE_MAX_LENGTH / 2,
        GRAVITY / MAX_LIFT_ACCEL
      );
      cableLength = CABLE_MAX_LENGTH / 2 - 0.1;
      cableTargetLength = CABLE_MAX_LENGTH;
      stepPhysics(FIXED_DT);
      result.palletAttachedWhileLowering =
        loadAttached() && cableLength < CABLE_MAX_LENGTH;

      startLevel(2, true);
      handleLoadKey();
      simulateFrames(90);
      result.cableDeployed = Math.abs(cableLength - CABLE_MAX_LENGTH) < 0.01;
      handleLoadKey();
      result.cableRetracts = cableTargetLength === 0;
      handleLoadKey();
      result.cableRedeploys = cableTargetLength === CABLE_MAX_LENGTH;
      setAirborne(
        PALLET_PICKUP_X,
        pallet.y + 1.3 + CABLE_MAX_LENGTH,
        0.72
      );
      cableLength = CABLE_MAX_LENGTH;
      cableTargetLength = CABLE_MAX_LENGTH;
      stepPhysics(FIXED_DT);
      result.palletAttached = loadAttached();
      const attachedAnchor = slingHardpoint();
      result.palletConstrained =
        Math.hypot(pallet.x - attachedAnchor.x, pallet.y - attachedAnchor.y) <=
        CABLE_MAX_LENGTH + 0.01;
      result.loadMassApplied = loadAttached() && LOAD_MASS_RATIO === 0.3;
      const cargoX = (CARGO_ZONE.x1 + CARGO_ZONE.x2) / 2;
      pallet.x = cargoX;
      pallet.y = cargoGroundY() + PALLET_HEIGHT + 0.2;
      pallet.vx = 0;
      pallet.vy = 0;
      releasePallet();
      result.validDelivery = deliveries === 1 && !!pallet;

      pallet.status = "attached";
      pallet.x = cargoX;
      pallet.y = cargoGroundY() + PALLET_HEIGHT + 8;
      pallet.vx = 0;
      pallet.vy = 0;
      releasePallet();
      result.brokenLoadFalls = pallet && pallet.status === "free";
      simulateFrames(180);
      result.brokenLoadReplaced =
        deliveries === 1 && pallet && pallet.status === "waiting" &&
        pallet.x === PALLET_PICKUP_X;

      while (deliveries < 3) {
        pallet.status = "attached";
        pallet.x = cargoX;
        pallet.y = cargoGroundY() + PALLET_HEIGHT + 0.2;
        pallet.vx = 0;
        pallet.vy = 0;
        releasePallet();
      }
      result.threeDelivered = deliveries === 3 && pallet === null;
      result.slingRetargeted = activeObjective().x ===
        (SHIP_DECK.x1 + SHIP_DECK.x2) / 2;
      settleLanding(SHIP_DECK);
      result.slingComplete = gameState === "levelComplete";
      result.distanceLabels =
        formatObjectiveDistance(999) === "999 m" &&
        formatObjectiveDistance(1000) === "1.0 km";
      onKey(
        { code: "Digit3", repeat: false, preventDefault: function() {} },
        true
      );
      result.levelSkip =
        levelIndex === 2 && level.mission === "sling" && gameState === "briefing";

      startLevel(3, true);
      result.rescueStartsAtStation = helicopter.landed &&
        helicopter.landedAt === STATION_PAD.name && level.worldMaxX > WORLD_MAX_X;
      result.rescueObjectiveHidden = activeObjective() === null;
      setAirborne(RESCUE_PERSON_X, RESCUE_CLEARING_Y + 24, 0.62);
      settleLanding(RESCUE_CLEARING);
      result.rescueRequiresSpotlight = !rescueAboard;

      startLevel(3, true);
      const heldSpotlightX = spotlightAimX;
      const heldSpotlightY = spotlightAimY;
      helicopter.x += 20;
      result.spotlightHoldsAngle =
        spotlightAimX === heldSpotlightX && spotlightAimY === heldSpotlightY;
      setAirborne(RESCUE_PERSON_X - 40, RESCUE_CLEARING_Y + 30, 0.62);
      aimSpotlightAt(RESCUE_PERSON_X, RESCUE_CLEARING_Y + 1);
      simulateFrames(Math.ceil(RESCUE_SPOTLIGHT_TIME / FIXED_DT) + 2);
      result.rescueLocated = rescueLocated && activeObjective().x === RESCUE_PERSON_X;
      helicopter.x = RESCUE_PERSON_X;
      settleLanding(RESCUE_CLEARING);
      result.rescuePickup = rescueAboard && helicopter.landedAt === RESCUE_CLEARING.name;
      settleLanding(STATION_PAD);
      result.rescueComplete = gameState === "levelComplete";
      onKey(
        { code: "Digit4", repeat: false, preventDefault: function() {} },
        true
      );
      result.rescueLevelSkip =
        levelIndex === 3 && level.mission === "rescue" && gameState === "briefing";

      startLevel(4, true);
      simulateFrames(20);
      result.medicalStartsOnShip = helicopter.landed &&
        helicopter.landedAt === SHIP_DECK.name && !patientAboard;
      result.medicalWindActive = Math.abs(medicalWindAcceleration()) > 0.1;
      result.medicalSwellActive = Math.abs(shipSwellOffset()) > 0.05 &&
        Math.abs(shipDeckVelocity()) > 0.01;
      settleLanding(shipDeckSurface());
      result.medicalShipRequiresPatient = gameState === "playing" && !patientAboard;
      settleLanding(STATION_PAD);
      result.medicalPatientBoards = patientAboard &&
        activeObjective().x === (SHIP_DECK.x1 + SHIP_DECK.x2) / 2;
      settleLanding(shipDeckSurface());
      result.medicalComplete = gameState === "levelComplete";
      onKey(
        { code: "Digit5", repeat: false, preventDefault: function() {} },
        true
      );
      result.medicalLevelSkip =
        levelIndex === 4 && level.mission === "medical" && gameState === "briefing";

      startLevel(5, true);
      result.summitStartsOnShip = helicopter.landed && helicopter.landedAt === SHIP_DECK.name &&
        !level.station && !!pallet && engineersAboard && !engineersDropped && !antennaInstalled;
      result.summitWindActive = Math.abs(medicalWindAcceleration()) > MEDICAL_WIND_BASE_ACCEL;
      helicopter.x = (SUMMIT_LEDGE.x1 + SUMMIT_LEDGE.x2) / 2;
      settleLanding(landingSurfaceAt(helicopter.x));
      result.summitEngineersDropped = engineersDropped && !engineersAboard &&
        activeObjective().x === PALLET_PICKUP_X;

      pallet.status = "attached";
      pallet.x = SUMMIT_PEAK.x1 - 5;
      pallet.y = SUMMIT_PEAK.y + PALLET_HEIGHT;
      pallet.vx = 0;
      pallet.vy = 0;
      releasePallet();
      result.summitMissedAntennaFails = gameState === "crashed" &&
        crashReason.indexOf("Radio repeater placement failed") === 0;

      startLevel(5, true);
      helicopter.x = (SUMMIT_LEDGE.x1 + SUMMIT_LEDGE.x2) / 2;
      settleLanding(landingSurfaceAt(helicopter.x));
      pallet.status = "attached";
      pallet.x = (SUMMIT_PEAK.x1 + SUMMIT_PEAK.x2) / 2;
      pallet.y = SUMMIT_PEAK.y + PALLET_HEIGHT;
      pallet.vx = 0;
      pallet.vy = 0;
      releasePallet();
      result.summitAntennaInstalled = antennaInstalled && pallet === null && gameState === "playing";
      helicopter.x = (SUMMIT_LEDGE.x1 + SUMMIT_LEDGE.x2) / 2;
      settleLanding(landingSurfaceAt(helicopter.x));
      result.summitEngineersRecovered = engineersAboard &&
        activeObjective().x === (SHIP_DECK.x1 + SHIP_DECK.x2) / 2;
      helicopter.x = (SHIP_DECK.x1 + SHIP_DECK.x2) / 2;
      settleLanding(shipDeckSurface());
      result.summitComplete = gameState === "levelComplete";
      onKey(
        { code: "Digit6", repeat: false, preventDefault: function() {} },
        true
      );
      result.summitLevelSkip =
        levelIndex === 5 && level.mission === "summit" && gameState === "briefing";

      startLevel(0, true);
      simulateFrames(20);
      result.nonMedicalDeckStatic = shipSwellOffset() === 0 &&
        shipDeckY() === SHIP_DECK_Y && shipDeckVelocity() === 0;

      result.pass = result.collectiveRaised === 35 &&
        result.collectivePersists &&
        result.landedCyclicPivots &&
        result.landedCyclicReturnsLevel &&
        result.svgShipGeometry &&
        result.slingRouteIsShort &&
        result.tiltedSkidTakeoff &&
        result.tiltedDeckLanding &&
        result.climbed > 3 &&
        result.heldAngleDeg >= 20 &&
        result.angleHeld &&
        result.forwardTravel > 2 &&
        result.unlimitedAngleDeg > 90 &&
        result.spaceLevelledDeg < 1 &&
        result.autoHoverEnabled &&
        result.autoHoverPitchCapped &&
        result.autoHoverLevels &&
        result.autoHoverBrakes &&
        result.autoHoverClimbTarget &&
        result.autoHoverAltitudeHeld &&
        result.pressureThrustDrops &&
        result.highAltitudeCannotHover &&
        result.lowSpeedSettles &&
        result.facesLeftInReverse &&
        result.facesRightForward &&
        result.safeLanding &&
        result.hardLandingCrash &&
        result.waterCrash &&
        result.terrainSkidLanding &&
        result.roofSkidLanding &&
        result.exposedDeckSkidLanding &&
        result.cockpitTerrainCrash &&
        result.mainRotorTerrainCrash &&
        result.tailRotorTerrainCrash &&
        result.shipProfileDeck &&
        result.shipProfileSuperstructure &&
        result.shipProfileNoPhantomWall &&
        result.shipProfileBoundary &&
        result.scoutHoverProgress &&
        result.icebergScouted &&
        result.scoutRetargeted &&
        result.scoutComplete &&
        result.passengersLoaded &&
        result.passengerComplete &&
        result.cargoZoneGrounded &&
        result.stationPadFlush &&
        result.cableDeployed &&
        result.cableRetracts &&
        result.cableRedeploys &&
        result.palletAttachedWhileLowering &&
        result.palletAttached &&
        result.palletConstrained &&
        result.loadMassApplied &&
        result.validDelivery &&
        result.brokenLoadFalls &&
        result.brokenLoadReplaced &&
        result.threeDelivered &&
        result.slingRetargeted &&
        result.slingComplete &&
        result.distanceLabels &&
        result.levelSkip &&
        result.rescueStartsAtStation &&
        result.rescueObjectiveHidden &&
        result.rescueRequiresSpotlight &&
        result.spotlightHoldsAngle &&
        result.rescueLocated &&
        result.rescuePickup &&
        result.rescueComplete &&
        result.rescueLevelSkip &&
        result.medicalStartsOnShip &&
        result.medicalWindActive &&
        result.medicalSwellActive &&
        result.medicalShipRequiresPatient &&
        result.medicalPatientBoards &&
        result.medicalComplete &&
        result.medicalLevelSkip &&
        result.summitStartsOnShip &&
        result.summitWindActive &&
        result.summitEngineersDropped &&
        result.summitMissedAntennaFails &&
        result.summitAntennaInstalled &&
        result.summitEngineersRecovered &&
        result.summitComplete &&
        result.summitLevelSkip &&
        result.nonMedicalDeckStatic;

      resetGame(false);
      const report = document.createElement("div");
      report.id = "test-result";
      report.textContent = JSON.stringify(result);
      document.body.appendChild(report);
      frame(performance.now());
    }

    resizeCanvas();
    resetGame(false);
    if (location.hash === "#test") runSelfTests();
    else {
      const playHash = /^#play([1-6])$/.exec(location.hash);
      if (playHash) startLevel(parseInt(playHash[1], 10) - 1, true);
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
