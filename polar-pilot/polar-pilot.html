<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Polar Pilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071928;
      color: #fff;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #test-result {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 8px;
      background: #fff;
      color: #111;
      font: 14px/1.35 Consolas, monospace;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Polar Pilot helicopter flight game"></canvas>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const nuyinaImage = new Image();
    nuyinaImage.src = "nuyina%20side%20profile.svg";

    /* ================= flight tuning =================
       World coordinates are metres, with altitude increasing upward.
       Angles are radians. Positive attitude tilts the rotor thrust right. */
    const FIXED_DT = 1 / 60;
    const GRAVITY = 9.81;
    const MAX_LIFT_ACCEL = GRAVITY * 1.8;
    const COLLECTIVE_RATE = 0.35;
    const CYCLIC_TARGET_RATE = 55 * Math.PI / 180;
    const ATTITUDE_STIFFNESS = 38;
    const ATTITUDE_DAMPING = 11;
    const MAX_ANGULAR_RATE = 95 * Math.PI / 180;
    const AUTO_HOVER_MAX_TILT = 25 * Math.PI / 180;
    const AUTO_HOVER_VELOCITY_DAMPING = 0.055;
    const AUTO_HOVER_ALTITUDE_RATE = 7;
    const AUTO_HOVER_ALTITUDE_STIFFNESS = 0.65;
    const AUTO_HOVER_ALTITUDE_DAMPING = 1.15;
    const AUTO_HOVER_MAX_CLIMB_ACCEL = 5;
    const AUTO_HOVER_MAX_DESCENT_ACCEL = 4.5;
    const HORIZONTAL_DRAG = 0.04;
    const HORIZONTAL_QUADRATIC_DRAG = 0.003;
    const VERTICAL_DRAG = 0.065;
    const VERTICAL_QUADRATIC_DRAG = 0.002;
    const MAX_HORIZONTAL_SPEED = 55;
    const MAX_VERTICAL_SPEED = 30;
    const SAFE_DESCENT_SPEED = 3;
    const SAFE_LATERAL_SPEED = 4;
    const SAFE_LANDING_ANGLE = 12 * Math.PI / 180;
    const SAFE_ANGULAR_RATE = 28 * Math.PI / 180;
    // The cabin begins to lose its deck clearance beyond this attitude, so
    // skid rocking is intentionally gentler than the old visual-only limit.
    const SKID_PIVOT_MAX_ANGLE = 10 * Math.PI / 180;
    const SKID_CONTACT_MAX_ANGLE = 12 * Math.PI / 180;
    const SKID_PIVOT_MAX_LATERAL_SPEED = 2.5;
    const SKID_PIVOT_MAX_DESCENT_SPEED = 4;
    const SKID_PIVOT_MAX_ANGULAR_RATE = 75 * Math.PI / 180;
    const DIRECTION_FLIP_SPEED = 12;
    const SCOUT_X = 650;
    const SCOUT_PEAK_Y = 34;
    const SCOUT_RADIUS = 60;
    const SCOUT_TIME = 4;
    const CABLE_MAX_LENGTH = 12;
    const CABLE_RATE = CABLE_MAX_LENGTH / 1.5;
    const CABLE_HOOK_VERTICAL_TOLERANCE = 1.25;
    const CABLE_HOOK_EDGE_TOLERANCE = 0.5;
    const LOAD_MASS_RATIO = 0.3;
    const PALLET_WIDTH = 6;
    const PALLET_HEIGHT = 4;
    // Centre of the SVG Cargopad layer after its world-space offset is applied.
    const PALLET_PICKUP_X = 114.491375;
    // Level 3's shore cargo zone is deliberately close to Nuyina: its centre
    // sits about 316 m from the SVG cargo pad for a compact sling route.
    const CARGO_ZONE = { x1: 390, x2: 470 };
    const SKID_DROP = 2.25;
    const PIXELS_PER_METRE = 4;
    const SHIP_DECK_Y = 13.488146;
    const SHIP_SWELL_AMPLITUDE = 1.5;
    const SHIP_SWELL_PERIOD = 8;
    const MEDICAL_WIND_BASE_ACCEL = 1.15;
    const MEDICAL_WIND_GUST_ACCEL = 0.5;
    const SUMMIT_WIND_BASE_ACCEL = 1.65;
    const SUMMIT_WIND_GUST_ACCEL = 0.85;
    const STATION_PAD_Y = 4.2;
    const WORLD_MIN_X = -300;
    const WORLD_MAX_X = 1025;
    const RESCUE_TERRAIN_START_X = 825;
    const RESCUE_PERSON_X = 1645;
    const RESCUE_CLEARING_Y = 18;
    const RESCUE_CLEARING_RADIUS = 18;
    const RESCUE_PICKUP_RADIUS = 13;
    const SPOTLIGHT_RANGE = 250;
    const SPOTLIGHT_HALF_ANGLE = 13 * Math.PI / 180;
    const RESCUE_SPOTLIGHT_TIME = 2;
    const SUMMIT_LEDGE = { x1: 774, x2: 802, y: 126, name: "ENGINEER LEDGE" };
    const SUMMIT_PEAK = { x1: 871, x2: 883, y: 188, name: "RADIO SUMMIT" };
    const SUMMIT_MOUNTAIN_POINTS = [
      [520, 0], [575, 25], [640, 58], [710, 95], [754, 120],
      [774, 126], [802, 126], [830, 145], [852, 171], [871, 188],
      [883, 188], [900, 164], [935, 118], [990, 58], [1050, 0],
    ];
    const ISA_SEA_LEVEL_TEMPERATURE = 288.15;
    const ISA_TEMPERATURE_LAPSE_RATE = 0.0065;
    const ISA_AIR_GAS_CONSTANT = 287.05;
    const ISA_TROPOPAUSE_ALTITUDE = 11000;

    // SVG coordinate metadata: 1 SVG pixel equals 1 metre and y=0 is the waterline.
    const NUYINA_SVG_WIDTH = 160;
    const NUYINA_SVG_HEIGHT = 100;
    // The artwork was repositioned 9.45 m upward inside its SVG page; offset it
    // back down at draw time so the ship waterline remains world y=0.
    const NUYINA_ARTWORK_Y_OFFSET = -9.45;
    const NUYINA_HELIPAD_SVG = { x1: 131.21849, x2: 159.740991, y: 13.488146 };
    const NUYINA_CARGO_PAD_SVG = { x1: 120.98923, x2: 130.9530238, y: 13.519649 };
    const NUYINA_WORLD_X = 134 -
      (NUYINA_HELIPAD_SVG.x1 + NUYINA_HELIPAD_SVG.x2) / 2;
    const SHIP_DECK = {
      x1: NUYINA_WORLD_X + NUYINA_HELIPAD_SVG.x1,
      x2: NUYINA_WORLD_X + NUYINA_HELIPAD_SVG.x2,
      y: SHIP_DECK_Y,
      name: "RSV NUYINA",
    };
    const SHIP_CARGO_PAD = {
      x1: NUYINA_WORLD_X + NUYINA_CARGO_PAD_SVG.x1,
      x2: NUYINA_WORLD_X + NUYINA_CARGO_PAD_SVG.x2,
      y: NUYINA_CARGO_PAD_SVG.y,
      name: "NUYINA CARGO PAD",
    };
    // Collision is expressed in SVG coordinates so it stays aligned with the
    // illustration if the ship is repositioned.  These are the visible major
    // deck and superstructure steps, read from the hull artwork rather than a
    // single rectangle.
    const NUYINA_SOLID_PROFILE_SVG = [
      [0, -8], [12, -15], [24, -20], [24.1, -29.7], [48, -29.7],
      [48.1, -23], [55, -23], [55.1, -34.2], [75, -34.2],
      [75.1, -35.2], [93, -35.2], [93.1, -22.3], [110, -22.3],
      [110.1, -22.94], [159.740991, -22.94],
    ];
    // The broad aft working deck is visibly clear from the cargo pad through
    // the stern.  Only the marked helipad is an objective landing zone.
    const SHIP_EXPOSED_DECK = {
      x1: NUYINA_WORLD_X + 110,
      x2: SHIP_DECK.x2,
      y: SHIP_DECK_Y,
      name: SHIP_DECK.name,
    };
    // Aurora Station is now a short flight east of Nuyina; the original layout
    // has shifted west by 1,275 m with its shoreline and rescue terrain.
    // Narrower than Nuyina's 28.5 m helipad, making station landings more precise.
    const STATION_PAD = { x1: 529, x2: 553, y: STATION_PAD_Y, name: "AURORA STATION" };
    const BUILDINGS = [
      { x1: 625, x2: 680, y1: 5, y2: 28 },
      { x1: 695, x2: 753, y1: 5, y2: 22 },
      { x1: 775, x2: 797, y1: 5, y2: 35 },
    ];
    const RESCUE_CLEARING = {
      x1: RESCUE_PERSON_X - RESCUE_CLEARING_RADIUS,
      x2: RESCUE_PERSON_X + RESCUE_CLEARING_RADIUS,
      y: RESCUE_CLEARING_Y,
      name: "SEARCH CLEARING",
    };

    const LEVELS = [
      {
        number: 1,
        name: "Iceberg Scout",
        mission: "scout",
        station: false,
        worldMaxX: 1250,
        brief: "Launch from RSV Nuyina, inspect the iceberg from a steady close hover, then return to the ship.",
      },
      {
        number: 2,
        name: "Expeditioner Transfer",
        mission: "passengers",
        station: true,
        worldMaxX: WORLD_MAX_X,
        brief: "Six expeditioners are aboard. Fly them safely from RSV Nuyina to Aurora Station.",
      },
      {
        number: 3,
        name: "Cage Pallet Lift",
        mission: "sling",
        station: true,
        worldMaxX: WORLD_MAX_X,
        brief: "Sling three cage pallets to the nearby shore cargo zone, then return and land aboard Nuyina.",
      },
      {
        number: 4,
        name: "Night Search and Rescue",
        mission: "rescue",
        station: true,
        worldMaxX: 2125,
        brief: "A missing expeditioner is somewhere east of Aurora Station. Search the dark terrain with the mouse-aimed spotlight, land beside them, then return to station.",
      },
      {
        number: 5,
        name: "Windy Medical Rescue",
        mission: "medical",
        station: true,
        worldMaxX: WORLD_MAX_X,
        brief: "A patient is waiting at Aurora Station. Fly through the crosswind, land to board them, then return to Nuyina's moving deck for treatment.",
      },
      {
        number: 6,
        name: "Summit Radio Relay",
        mission: "summit",
        station: false,
        worldMaxX: 1250,
        brief: "In strong mountain winds, land two engineers on the ledge, sling Nuyina's radio repeater onto the narrow summit, collect the team, and return to the ship.",
      },
    ];

    const input = {
      left: false,
      right: false,
      up: false,
      down: false,
      level: false,
    };
    const helicopter = {
      x: 134,
      y: SHIP_DECK_Y + SKID_DROP,
      vx: 0,
      vy: 0,
      angle: 0,
      targetAngle: 0,
      angularVelocity: 0,
      collective: 0,
      landed: true,
      landedAt: SHIP_DECK.name,
      landedSurface: null,
      facing: 1,
    };

    let gameState = "title"; // title | briefing | playing | crashed | levelComplete | gameComplete
    let crashReason = "";
    let levelIndex = 0;
    let level = LEVELS[0];
    let scoutTimer = 0;
    let icebergScouted = false;
    let rescueSpotlightTimer = 0;
    let rescueLocated = false;
    let rescueAboard = false;
    let patientAboard = false;
    let engineersDropped = false;
    let engineersAboard = true;
    let antennaInstalled = false;
    // Unit vector in world space; it holds the spotlight bearing between mouse moves.
    let spotlightAimX = 1;
    let spotlightAimY = -0.15;
    let passengersAboard = 0;
    let deliveries = 0;
    let deliveredPallets = [];
    let pallet = null;
    let cableLength = 0;
    let cableTargetLength = 0;
    let missionNotice = "";
    let missionNoticeTimer = 0;
    let viewWidth = 960;
    let viewHeight = 640;
    let deviceScale = 1;
    let cameraX = helicopter.x;
    let cameraY = 30;
    let rotorPhase = 0;
    let elapsed = 0;
    let lastFrame = performance.now();
    let accumulator = 0;
    let testMode = false;
    let autoHoverEnabled = false;
    let autoHoverTargetAltitude = 0;

    const snow = [];
    const washParticles = [];

    window.onerror = function(message, source, line) {
      const error = document.createElement("div");
      error.id = "test-result";
      error.style.background = "#8b1520";
      error.style.color = "#fff";
      error.textContent = "ERROR: " + message + " (line " + line + ")";
      document.body.appendChild(error);
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function barometricPressureRatio(altitude) {
      const height = Math.max(0, altitude);
      const exponent = GRAVITY / (ISA_AIR_GAS_CONSTANT * ISA_TEMPERATURE_LAPSE_RATE);
      const tropopauseTemperature =
        ISA_SEA_LEVEL_TEMPERATURE - ISA_TEMPERATURE_LAPSE_RATE * ISA_TROPOPAUSE_ALTITUDE;
      const tropopausePressureRatio = Math.pow(
        tropopauseTemperature / ISA_SEA_LEVEL_TEMPERATURE,
        exponent
      );
      if (height <= ISA_TROPOPAUSE_ALTITUDE) {
        return Math.pow(
          1 - ISA_TEMPERATURE_LAPSE_RATE * height / ISA_SEA_LEVEL_TEMPERATURE,
          exponent
        );
      }
      return tropopausePressureRatio * Math.exp(
        -GRAVITY * (height - ISA_TROPOPAUSE_ALTITUDE) /
        (ISA_AIR_GAS_CONSTANT * tropopauseTemperature)
      );
    }

    function availableLiftAccelerationAt(altitude) {
      return MAX_LIFT_ACCEL * barometricPressureRatio(altitude);
    }

    function lerp(a, b, amount) {
      return a + (b - a) * amount;
    }

    function shipSwellOffset() {
      if (!level || level.mission !== "medical") return 0;
      return SHIP_SWELL_AMPLITUDE * Math.sin(Math.PI * 2 * elapsed / SHIP_SWELL_PERIOD);
    }

    function shipDeckY() {
      return SHIP_DECK_Y + shipSwellOffset();
    }

    function shipDeckVelocity() {
      if (!level || level.mission !== "medical") return 0;
      return SHIP_SWELL_AMPLITUDE * Math.PI * 2 / SHIP_SWELL_PERIOD *
        Math.cos(Math.PI * 2 * elapsed / SHIP_SWELL_PERIOD);
    }

    function shipDeckSurface() {
      return {
        x1: SHIP_DECK.x1,
        x2: SHIP_DECK.x2,
        y: shipDeckY(),
        name: SHIP_DECK.name,
        kind: "shipHelipad",
      };
    }

    function shipCargoPadY() {
      return SHIP_CARGO_PAD.y + shipSwellOffset();
    }

    function surfaceVerticalVelocity(surface) {
      return surface && (surface.kind === "shipHelipad" || surface.kind === "shipDeck" ||
        surface.name === SHIP_DECK.name) ? shipDeckVelocity() : 0;
    }

    function medicalWindAcceleration() {
      if (!level || (level.mission !== "medical" && level.mission !== "summit")) return 0;
      const base = level.mission === "summit" ? SUMMIT_WIND_BASE_ACCEL : MEDICAL_WIND_BASE_ACCEL;
      const gust = level.mission === "summit" ? SUMMIT_WIND_GUST_ACCEL : MEDICAL_WIND_GUST_ACCEL;
      return base + gust * Math.sin(elapsed * 0.9) + gust * 0.45 * Math.sin(elapsed * 2.1 + 0.7);
    }

    function medicalWindSpeed() {
      if (!level || (level.mission !== "medical" && level.mission !== "summit")) return 0;
      const base = level.mission === "summit" ? 18 : 12;
      const gust = level.mission === "summit" ? 5.2 : 3.5;
      return base + gust * Math.sin(elapsed * 0.9) + gust * 0.45 * Math.sin(elapsed * 2.1 + 0.7);
    }

    function resizeCanvas() {
      viewWidth = Math.max(320, window.innerWidth);
      viewHeight = Math.max(420, window.innerHeight);
      deviceScale = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(viewWidth * deviceScale);
      canvas.height = Math.round(viewHeight * deviceScale);
      canvas.style.width = viewWidth + "px";
      canvas.style.height = viewHeight + "px";
      ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
      seedSnow();
    }

    function seedSnow() {
      snow.length = 0;
      const count = Math.round(clamp(viewWidth * viewHeight / 9000, 55, 170));
      for (let i = 0; i < count; i++) {
        snow.push({
          x: Math.random() * viewWidth,
          y: Math.random() * viewHeight,
          speed: 18 + Math.random() * 38,
          drift: 5 + Math.random() * 12,
          size: 0.7 + Math.random() * 1.8,
          alpha: 0.25 + Math.random() * 0.55,
        });
      }
    }

    function clearInput() {
      input.left = input.right = input.up = input.down = input.level = false;
    }

    function setAutoHover(enabled) {
      autoHoverEnabled = enabled;
      if (autoHoverEnabled) {
        autoHoverTargetAltitude = helicopter.y;
        helicopter.targetAngle = 0;
      }
    }

    function resetAircraft() {
      helicopter.x = 134;
      helicopter.y = shipDeckY() + SKID_DROP;
      helicopter.vx = 0;
      helicopter.vy = 0;
      helicopter.angle = 0;
      helicopter.targetAngle = 0;
      helicopter.angularVelocity = 0;
      helicopter.collective = 0;
      helicopter.landed = true;
      helicopter.landedAt = SHIP_DECK.name;
      helicopter.landedSurface = null;
      helicopter.facing = 1;
      if (level && level.mission === "rescue") {
        helicopter.x = (STATION_PAD.x1 + STATION_PAD.x2) / 2;
        helicopter.y = STATION_PAD_Y + SKID_DROP;
        helicopter.landedAt = STATION_PAD.name;
      }
    }

    function spawnPallet() {
      pallet = {
        x: PALLET_PICKUP_X,
        y: shipCargoPadY() + PALLET_HEIGHT,
        vx: 0,
        vy: 0,
        status: "waiting", // waiting | attached | free
      };
    }

    function resetLevel(nextState) {
      elapsed = 0;
      resetAircraft();
      autoHoverEnabled = false;
      autoHoverTargetAltitude = helicopter.y;
      cameraX = helicopter.x;
      cameraY = 30;
      crashReason = "";
      scoutTimer = 0;
      icebergScouted = false;
      rescueSpotlightTimer = 0;
      rescueLocated = false;
      rescueAboard = false;
      patientAboard = false;
      engineersDropped = false;
      engineersAboard = true;
      antennaInstalled = false;
      spotlightAimX = 1;
      spotlightAimY = -0.15;
      passengersAboard = level.mission === "passengers" ? 6 : 0;
      deliveries = 0;
      deliveredPallets = [];
      pallet = null;
      cableLength = 0;
      cableTargetLength = 0;
      missionNotice = "";
      missionNoticeTimer = 0;
      if (usesSlingLoad()) spawnPallet();
      washParticles.length = 0;
      clearInput();
      gameState = nextState || "briefing";
    }

    function startLevel(index, directPlay) {
      levelIndex = clamp(index, 0, LEVELS.length - 1);
      level = LEVELS[levelIndex];
      resetLevel(directPlay ? "playing" : "briefing");
    }

    /* Compatibility helper used by the built-in baseline flight checks. */
    function resetGame(startPlaying) {
      levelIndex = 0;
      level = LEVELS[0];
      resetLevel(startPlaying ? "playing" : "title");
    }

    function iceHeightAt(x) {
      if (!level.station) return -Infinity;
      if (x >= STATION_PAD.x1 && x <= STATION_PAD.x2) return STATION_PAD_Y;
      if (x < 295) return -Infinity;
      const stationIce = 4.2 + Math.sin(x * 0.021) * 0.7 + Math.sin(x * 0.053) * 0.35;
      return level.mission === "rescue" && x >= RESCUE_TERRAIN_START_X ?
        rescueTerrainHeightAt(x) : stationIce;
    }

    function rescueTerrainHeightAt(x) {
      const rolling = 10 + Math.sin((x - RESCUE_TERRAIN_START_X) * 0.018) * 5 +
        Math.sin((x - RESCUE_TERRAIN_START_X) * 0.051) * 2.6;
      const distance = Math.abs(x - RESCUE_PERSON_X);
      if (distance <= RESCUE_CLEARING_RADIUS) return RESCUE_CLEARING_Y;
      if (distance >= RESCUE_CLEARING_RADIUS + 32) return rolling;
      const blend = (distance - RESCUE_CLEARING_RADIUS) / 32;
      const smoothBlend = blend * blend * (3 - 2 * blend);
      return lerp(RESCUE_CLEARING_Y, rolling, smoothBlend);
    }

    function icebergHeightAt(x) {
      if (level.mission !== "scout" || x < 555 || x > 745) return -Infinity;
      const points = [
        [555, 0], [580, 8], [610, 18], [636, 31],
        [650, SCOUT_PEAK_Y], [672, 24], [705, 13], [745, 0],
      ];
      for (let i = 1; i < points.length; i++) {
        if (x <= points[i][0]) {
          const a = points[i - 1], b = points[i];
          const t = (x - a[0]) / (b[0] - a[0]);
          return lerp(a[1], b[1], t);
        }
      }
      return 0;
    }

    function summitHeightAt(x) {
      if (level.mission !== "summit" ||
          x < SUMMIT_MOUNTAIN_POINTS[0][0] ||
          x > SUMMIT_MOUNTAIN_POINTS[SUMMIT_MOUNTAIN_POINTS.length - 1][0]) return -Infinity;
      for (let i = 1; i < SUMMIT_MOUNTAIN_POINTS.length; i++) {
        if (x <= SUMMIT_MOUNTAIN_POINTS[i][0]) {
          const a = SUMMIT_MOUNTAIN_POINTS[i - 1], b = SUMMIT_MOUNTAIN_POINTS[i];
          return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0]));
        }
      }
      return 0;
    }

    function nuyinaWorldY(svgY) {
      return NUYINA_ARTWORK_Y_OFFSET - svgY + shipSwellOffset();
    }

    function shipSolidHeightAt(x) {
      const svgX = x - NUYINA_WORLD_X;
      const points = NUYINA_SOLID_PROFILE_SVG;
      if (svgX < points[0][0] || svgX > points[points.length - 1][0]) return -Infinity;
      for (let i = 1; i < points.length; i++) {
        if (svgX <= points[i][0]) {
          const a = points[i - 1], b = points[i];
          return nuyinaWorldY(lerp(a[1], b[1], (svgX - a[0]) / (b[0] - a[0])));
        }
      }
      return nuyinaWorldY(points[points.length - 1][1]);
    }

    function terrainHeightAt(x) {
      return Math.max(iceHeightAt(x), icebergHeightAt(x), summitHeightAt(x));
    }

    function shipLandingSurfaceAt(x) {
      if (x < SHIP_EXPOSED_DECK.x1 || x > SHIP_EXPOSED_DECK.x2) return null;
      return {
        x1: SHIP_EXPOSED_DECK.x1, x2: SHIP_EXPOSED_DECK.x2, y: shipDeckY(),
        name: SHIP_DECK.name,
        kind: x >= SHIP_DECK.x1 && x <= SHIP_DECK.x2 ? "shipHelipad" : "shipDeck",
      };
    }

    function landingSurfaceAt(x) {
      const shipSurface = shipLandingSurfaceAt(x);
      if (shipSurface) return shipSurface;
      if (level.station && x >= STATION_PAD.x1 && x <= STATION_PAD.x2) {
        return { ...STATION_PAD, kind: "stationPad" };
      }
      if (level.mission === "rescue" && x >= RESCUE_CLEARING.x1 && x <= RESCUE_CLEARING.x2) {
        return { ...RESCUE_CLEARING, kind: "rescueClearing" };
      }
      if (level.station) {
        for (let i = 0; i < BUILDINGS.length; i++) {
          const building = BUILDINGS[i];
          if (x >= building.x1 && x <= building.x2) {
            return { x1: building.x1, x2: building.x2, y: building.y2, name: "STATION ROOF", kind: "roof", buildingIndex: i };
          }
        }
      }
      const terrain = terrainHeightAt(x);
      return Number.isFinite(terrain) ? { y: terrain, name: "TERRAIN", kind: "terrain" } : null;
    }

    function surfaceHeightAt(surface, x) {
      if (!surface) return -Infinity;
      if (surface.kind === "shipHelipad" || surface.kind === "shipDeck" || surface === SHIP_DECK) {
        return shipDeckY();
      }
      if (surface.kind === "terrain") return terrainHeightAt(x);
      return surface.y;
    }

    function solidHeightAt(x) {
      let solid = shipSolidHeightAt(x);
      if (level.station) {
        for (const building of BUILDINGS) {
          if (x >= building.x1 && x <= building.x2) solid = Math.max(solid, building.y2);
        }
      }
      return Math.max(solid, terrainHeightAt(x));
    }

    function helicopterPose() {
      return { x: helicopter.x, y: helicopter.y, angle: helicopter.angle, facing: helicopter.facing };
    }

    function helicopterPoint(localX, localY, pose) {
      const cos = Math.cos(pose.angle);
      const sin = Math.sin(pose.angle);
      const mirroredX = localX * pose.facing;
      return {
        x: pose.x + mirroredX * cos - localY * sin,
        y: pose.y - (mirroredX * sin + localY * cos),
      };
    }

    function skidContacts(pose) {
      // Use the lowest rail line as the support plane; the visual upturns at
      // either end remain decorative and do not leave the aircraft hovering.
      return [[-3.55, SKID_DROP], [4.3, SKID_DROP]].map(([x, y]) => helicopterPoint(x, y, pose));
    }

    function lowestSkidAltitude() {
      return Math.min(...skidContacts(helicopterPose()).map(point => point.y));
    }

    function dangerousHelicopterHitsSolid(previousPose) {
      const currentPose = helicopterPose();
      const travel = Math.hypot(currentPose.x - previousPose.x, currentPose.y - previousPose.y) +
        Math.abs(currentPose.angle - previousPose.angle) * 8;
      const steps = Math.max(1, Math.ceil(travel / 0.25));
      // Cockpit perimeter, main rotor span, and tail-rotor disc samples.
      const probes = [
        [-1.8, 0.9], [-1.8, -0.7], [-1.15, -1.65], [0.5, -1.85],
        [2.3, -1.55], [4.35, -0.35], [3.55, 1.1], [1.0, 1.4],
        [-7.7, -3.18], [-3.8, -3.18], [0.15, -3.18], [4.0, -3.18], [7.9, -3.18],
        [-7.88, -1.83], [-7.88, -0.78], [-7.88, 0.27],
      ];
      for (let step = 0; step <= steps; step++) {
        const t = step / steps;
        const pose = {
          x: lerp(previousPose.x, currentPose.x, t), y: lerp(previousPose.y, currentPose.y, t),
          angle: lerp(previousPose.angle, currentPose.angle, t), facing: currentPose.facing,
        };
        for (const [x, y] of probes) {
          const point = helicopterPoint(x, y, pose);
          if (point.y <= solidHeightAt(point.x) + 0.02) return true;
        }
      }
      return false;
    }

    function crash(reason) {
      if (gameState !== "playing") return;
      crashReason = reason;
      gameState = "crashed";
      helicopter.landed = false;
      helicopter.landedSurface = null;
      clearInput();
    }

    function completeLevel() {
      if (gameState !== "playing") return;
      gameState = "levelComplete";
      clearInput();
    }

    function setMissionNotice(text) {
      missionNotice = text;
      missionNoticeTimer = 2.5;
    }

    function settleLanding(surface) {
      if (!surface.kind) {
        if (surface === SHIP_DECK) surface = shipDeckSurface();
        else if (surface === STATION_PAD) surface = { ...STATION_PAD, kind: "stationPad" };
        else if (surface === RESCUE_CLEARING) surface = { ...RESCUE_CLEARING, kind: "rescueClearing" };
      }
      helicopter.y = surfaceHeightAt(surface, helicopter.x) + SKID_DROP;
      helicopter.vx = 0;
      helicopter.vy = surfaceVerticalVelocity(surface);
      helicopter.angle = 0;
      helicopter.targetAngle = 0;
      helicopter.angularVelocity = 0;
      helicopter.landed = true;
      helicopter.landedAt = surface.name;
      helicopter.landedSurface = surface;
      if (level.mission === "scout" && icebergScouted && surface.kind === "shipHelipad") {
        completeLevel();
      } else if (level.mission === "passengers" && surface.kind === "stationPad") {
        passengersAboard = 0;
        completeLevel();
      } else if (level.mission === "sling" && deliveries === 3 && surface.kind === "shipHelipad") {
        completeLevel();
      } else if (level.mission === "rescue") {
        if (surface.kind === "rescueClearing" && rescueLocated && !rescueAboard &&
            Math.abs(helicopter.x - RESCUE_PERSON_X) <= RESCUE_PICKUP_RADIUS) {
          rescueAboard = true;
          setMissionNotice("EXPEDITIONER ABOARD - RETURN TO STATION");
        } else if (surface.kind === "stationPad" && rescueAboard) {
          completeLevel();
        }
      } else if (level.mission === "medical") {
        if (surface.kind === "stationPad" && !patientAboard) {
          patientAboard = true;
          setMissionNotice("PATIENT ABOARD - RETURN TO NUYINA");
        } else if (surface.kind === "shipHelipad" && patientAboard) {
          completeLevel();
        }
      } else if (level.mission === "summit") {
        const onLedge = surface.kind === "terrain" &&
          helicopter.x >= SUMMIT_LEDGE.x1 && helicopter.x <= SUMMIT_LEDGE.x2;
        if (onLedge && !engineersDropped) {
          engineersDropped = true;
          engineersAboard = false;
          setMissionNotice("ENGINEERS DEPLOYED - RETURN TO NUYINA FOR THE REPEATER");
        } else if (onLedge && antennaInstalled && !engineersAboard) {
          engineersAboard = true;
          setMissionNotice("ENGINEERS ABOARD - RETURN TO NUYINA");
        } else if (surface.kind === "shipHelipad" && engineersAboard && antennaInstalled) {
          completeLevel();
        }
      }
    }

    function holdOnSkids(surface) {
      // Keep the lower skid on the surface while the aircraft gently rocks.
      const surfaceHeight = surfaceHeightAt(surface, helicopter.x);
      const lowestSkid = Math.min(...skidContacts(helicopterPose()).map(point => point.y));
      helicopter.y += surfaceHeight - lowestSkid;
      helicopter.vx = 0;
      helicopter.vy = surfaceVerticalVelocity(surface);
      helicopter.landed = true;
      helicopter.landedAt = surface.name;
      helicopter.landedSurface = surface;
    }

    function canRockOnSkids(surface) {
      const relativeVerticalSpeed = helicopter.vy - surfaceVerticalVelocity(surface);
      return Math.abs(helicopter.angle) <= SKID_CONTACT_MAX_ANGLE &&
        Math.abs(helicopter.vx) <= SKID_PIVOT_MAX_LATERAL_SPEED &&
        -relativeVerticalSpeed <= SKID_PIVOT_MAX_DESCENT_SPEED &&
        Math.abs(helicopter.angularVelocity) <= SKID_PIVOT_MAX_ANGULAR_RATE;
    }

    function checkContact(previousPose) {
      if (dangerousHelicopterHitsSolid(previousPose)) {
        crash("Cockpit or rotor impact — keep the aircraft clear of terrain and structures.");
        return;
      }

      const contacts = skidContacts(helicopterPose()).map(point => {
        const surface = landingSurfaceAt(point.x);
        return { point, surface, height: surfaceHeightAt(surface, point.x) };
      });
      const touching = contacts.filter(contact => contact.surface && contact.point.y <= contact.height + 0.03);
      const activeContact = touching.sort((a, b) => (b.height - b.point.y) - (a.height - a.point.y))[0];
      const landingSurface = activeContact && activeContact.surface;
      const surfaceVelocity = surfaceVerticalVelocity(landingSurface);
      const relativeVerticalSpeed = helicopter.vy - surfaceVelocity;
      if (landingSurface && relativeVerticalSpeed <= 0) {
        const safe = -relativeVerticalSpeed <= SAFE_DESCENT_SPEED &&
          Math.abs(helicopter.vx) <= SAFE_LATERAL_SPEED &&
          Math.abs(helicopter.angle) <= SAFE_LANDING_ANGLE &&
          Math.abs(helicopter.angularVelocity) <= SAFE_ANGULAR_RATE;
        if (safe) settleLanding(landingSurface);
        else if (canRockOnSkids(landingSurface)) holdOnSkids(landingSurface);
        else crash("Hard landing — lower the collective earlier and touch down level.");
        return;
      }

      const solidHeight = solidHeightAt(helicopter.x);
      // A skid that is just lifting away from a valid support is not a hull
      // strike; only non-landable solid contact reaches this fallback.
      if (!touching.length && lowestSkidAltitude() <= solidHeight) {
        crash(
          helicopter.x < 300 ? "You struck RSV Nuyina." :
          level.mission === "scout" ? "You struck the iceberg." :
          "You struck the terrain."
        );
        return;
      }

      if (lowestSkidAltitude() <= 0) {
        crash("Water impact — keep enough collective to arrest the descent.");
        return;
      }

      if (helicopter.x < WORLD_MIN_X || helicopter.x > level.worldMaxX) {
        crash("You left the local flight area.");
      }
    }

    function cargoGroundY() {
      return iceHeightAt((CARGO_ZONE.x1 + CARGO_ZONE.x2) / 2);
    }

    function usesSlingLoad() {
      return level.mission === "sling" || level.mission === "summit";
    }

    function loadAttached() {
      return !!pallet && pallet.status === "attached";
    }

    function slingHardpoint() {
      return { x: helicopter.x, y: helicopter.y - 1.3 };
    }

    function palletSurfaceY(x) {
      const solid = solidHeightAt(x);
      return Number.isFinite(solid) ? Math.max(0, solid) : 0;
    }

    function palletHitsBuilding() {
      if (!pallet || !level.station) return false;
      const centreY = pallet.y - PALLET_HEIGHT / 2;
      for (const b of BUILDINGS) {
        if (pallet.x + PALLET_WIDTH / 2 > b.x1 &&
            pallet.x - PALLET_WIDTH / 2 < b.x2 &&
            centreY + PALLET_HEIGHT / 2 > b.y1 &&
            centreY - PALLET_HEIGHT / 2 < b.y2) return true;
      }
      return false;
    }

    function replacePallet(message) {
      if (deliveries >= 3) {
        pallet = null;
        return;
      }
      spawnPallet();
      cableTargetLength = cableLength > 0 ? CABLE_MAX_LENGTH : 0;
      setMissionNotice(message || "LOAD BROKEN — REPLACEMENT READY");
    }

    function attachPallet() {
      if (!pallet) return;
      pallet.status = "attached";
      setMissionNotice(level.mission === "summit" ? "RADIO REPEATER ATTACHED" : "CAGE ATTACHED");
    }

    function deliveryIsValid() {
      if (!pallet) return false;
      const ground = cargoGroundY();
      const bottom = pallet.y - PALLET_HEIGHT;
      return pallet.x >= CARGO_ZONE.x1 + PALLET_WIDTH / 2 &&
        pallet.x <= CARGO_ZONE.x2 - PALLET_WIDTH / 2 &&
        bottom <= ground + 0.75 &&
        Math.abs(pallet.vx) <= 1.5 &&
        Math.abs(pallet.vy) <= 1;
    }

    function antennaDeliveryIsValid() {
      if (!pallet) return false;
      const bottom = pallet.y - PALLET_HEIGHT;
      return antennaInstalled === false &&
        pallet.x >= SUMMIT_PEAK.x1 + PALLET_WIDTH / 2 &&
        pallet.x <= SUMMIT_PEAK.x2 - PALLET_WIDTH / 2 &&
        bottom <= SUMMIT_PEAK.y + 0.75 &&
        Math.abs(pallet.vx) <= 1.5 &&
        Math.abs(pallet.vy) <= 1;
    }

    function releasePallet() {
      if (!loadAttached()) return;
      if (level.mission === "summit") {
        if (antennaDeliveryIsValid()) {
          antennaInstalled = true;
          pallet = null;
          setMissionNotice("RADIO REPEATER INSTALLED - PICK UP THE ENGINEERS");
        } else {
          crash("Radio repeater placement failed - the summit target was missed.");
        }
        return;
      }
      if (deliveryIsValid()) {
        const slot = deliveries;
        deliveredPallets.push({
          x: CARGO_ZONE.x1 + 13 + slot * 18,
          y: cargoGroundY() + PALLET_HEIGHT,
        });
        deliveries++;
        pallet = null;
        setMissionNotice("CAGE DELIVERED — " + deliveries + " / 3");
        if (deliveries < 3) spawnPallet();
        else setMissionNotice("ALL CAGES DELIVERED — RETURN TO NUYINA");
        return;
      }

      pallet.status = "free";
      setMissionNotice("CAGE RELEASED — WATCH FOR IMPACT");
    }

    function handleLoadKey() {
      if (gameState !== "playing" || !usesSlingLoad()) return;
      if (level.mission === "summit" && !engineersDropped) {
        setMissionNotice("DROP THE ENGINEERS ON THE LEDGE FIRST");
        return;
      }
      if (loadAttached()) {
        releasePallet();
      } else if (cableTargetLength > 0) {
        cableTargetLength = 0;
        setMissionNotice("LOAD LINE RETRACTING");
      } else {
        cableTargetLength = CABLE_MAX_LENGTH;
        setMissionNotice("LOAD LINE LOWERING");
      }
    }

    function slingAngleDegrees() {
      if (!loadAttached()) return 0;
      const anchor = slingHardpoint();
      const dx = pallet.x - anchor.x;
      const dy = pallet.y - anchor.y;
      return Math.atan2(Math.abs(dx), Math.max(0.01, -dy)) * 180 / Math.PI;
    }

    function updateSling(dt) {
      if (!usesSlingLoad()) return;
      if (!loadAttached()) {
        if (cableLength < cableTargetLength) {
          cableLength = Math.min(cableTargetLength, cableLength + CABLE_RATE * dt);
        } else if (cableLength > cableTargetLength) {
          cableLength = Math.max(cableTargetLength, cableLength - CABLE_RATE * dt);
        }
      } else {
        cableLength = CABLE_MAX_LENGTH;
        cableTargetLength = CABLE_MAX_LENGTH;
      }

      if (!pallet) return;
      const anchor = slingHardpoint();

      if (!loadAttached() && cableTargetLength > 0 && cableLength > 0.02) {
        const hookY = anchor.y - cableLength;
        const relativeSpeed = Math.hypot(
          helicopter.vx - pallet.vx,
          helicopter.vy - pallet.vy
        );
        const hookOverCage =
          Math.abs(anchor.x - pallet.x) <=
            PALLET_WIDTH / 2 + CABLE_HOOK_EDGE_TOLERANCE &&
          Math.abs(hookY - pallet.y) <= CABLE_HOOK_VERTICAL_TOLERANCE;
        if (hookOverCage &&
            relativeSpeed <= 2) attachPallet();
      }

      if (loadAttached()) {
        pallet.vx += -pallet.vx * 0.08 * dt;
        pallet.vy += (-GRAVITY - pallet.vy * 0.05) * dt;
        pallet.x += pallet.vx * dt;
        pallet.y += pallet.vy * dt;

        let dx = pallet.x - anchor.x;
        let dy = pallet.y - anchor.y;
        let distance = Math.hypot(dx, dy) || CABLE_MAX_LENGTH;
        const nx = dx / distance;
        const ny = dy / distance;
        if (distance > CABLE_MAX_LENGTH) {
          pallet.x = anchor.x + nx * CABLE_MAX_LENGTH;
          pallet.y = anchor.y + ny * CABLE_MAX_LENGTH;
          const relativeVx = pallet.vx - helicopter.vx;
          const relativeVy = pallet.vy - helicopter.vy;
          const radialSpeed = relativeVx * nx + relativeVy * ny;
          if (radialSpeed > 0) {
            pallet.vx -= radialSpeed * nx;
            pallet.vy -= radialSpeed * ny;
            const reaction = radialSpeed * LOAD_MASS_RATIO / (1 + LOAD_MASS_RATIO);
            helicopter.vx += reaction * nx;
            helicopter.vy += reaction * ny;
          }
        }
      } else if (pallet.status === "free") {
        pallet.vx += -pallet.vx * 0.08 * dt;
        pallet.vy += (-GRAVITY - pallet.vy * 0.05) * dt;
        pallet.x += pallet.vx * dt;
        pallet.y += pallet.vy * dt;
      }

      if (palletHitsBuilding()) {
        replacePallet();
        return;
      }

      if (pallet.status === "attached" || pallet.status === "free") {
        const surface = palletSurfaceY(pallet.x);
        const bottom = pallet.y - PALLET_HEIGHT;
        if (bottom <= surface) {
          const overWater = surface === 0 && !Number.isFinite(solidHeightAt(pallet.x));
          if (pallet.status === "free" || overWater || -pallet.vy > 2.5 || Math.abs(pallet.vx) > 4) {
            replacePallet("LOAD LOST — REPLACEMENT READY");
          } else {
            pallet.y = surface + PALLET_HEIGHT;
            pallet.vx *= 0.65;
            pallet.vy = 0;
          }
        }
      }
    }

    function isScoutHoverValid() {
      const heightAbovePeak = helicopter.y - SCOUT_PEAK_Y;
      return level.mission === "scout" && !icebergScouted && !helicopter.landed &&
        Math.abs(helicopter.x - SCOUT_X) <= SCOUT_RADIUS &&
        heightAbovePeak >= 15 && heightAbovePeak <= 45 &&
        Math.hypot(helicopter.vx, helicopter.vy) <= 3;
    }

    function updateMission(dt) {
      if (missionNoticeTimer > 0) {
        missionNoticeTimer -= dt;
        if (missionNoticeTimer <= 0) missionNotice = "";
      }
      if (level.mission === "scout" && !icebergScouted && !helicopter.landed) {
        scoutTimer = isScoutHoverValid() ? scoutTimer + dt : 0;
        if (scoutTimer >= SCOUT_TIME) {
          scoutTimer = SCOUT_TIME;
          icebergScouted = true;
          setMissionNotice("ICEBERG SCOUTED — RETURN TO NUYINA");
        }
      }
      if (level.mission === "rescue" && !rescueLocated && !rescueAboard) {
        rescueSpotlightTimer = isRescueSpotlightOnPerson() ?
          Math.min(RESCUE_SPOTLIGHT_TIME, rescueSpotlightTimer + dt) : 0;
        if (rescueSpotlightTimer >= RESCUE_SPOTLIGHT_TIME) {
          rescueLocated = true;
          setMissionNotice("EXPEDITIONER LOCATED - LAND IN THE CLEARING");
        }
      }
    }

    function stepPhysics(dt) {
      if (gameState !== "playing") return;

      const previousPose = helicopterPose();

      const massFactor = loadAttached() ? 1 + LOAD_MASS_RATIO : 1;
      const availableLiftAcceleration = availableLiftAccelerationAt(helicopter.y);

      if (autoHoverEnabled) {
        if (input.up !== input.down) {
          autoHoverTargetAltitude +=
            (input.up ? 1 : -1) * AUTO_HOVER_ALTITUDE_RATE * dt;
        }
        autoHoverTargetAltitude = Math.max(SKID_DROP, autoHoverTargetAltitude);
        const desiredVerticalAcceleration = clamp(
          (autoHoverTargetAltitude - helicopter.y) * AUTO_HOVER_ALTITUDE_STIFFNESS -
          helicopter.vy * AUTO_HOVER_ALTITUDE_DAMPING,
          -AUTO_HOVER_MAX_DESCENT_ACCEL, AUTO_HOVER_MAX_CLIMB_ACCEL
        );
        helicopter.collective = clamp(
          (GRAVITY + desiredVerticalAcceleration) * massFactor / availableLiftAcceleration,
          0, 1
        );
      } else if (input.up !== input.down) {
        helicopter.collective += (input.up ? 1 : -1) * COLLECTIVE_RATE * dt;
        helicopter.collective = clamp(helicopter.collective, 0, 1);
      }

      const onSkids = helicopter.landed;
      if (input.level || (onSkids && input.left === input.right)) {
        helicopter.targetAngle = 0;
      } else if (autoHoverEnabled) {
        helicopter.targetAngle = input.right !== input.left ?
          (input.right ? AUTO_HOVER_MAX_TILT : -AUTO_HOVER_MAX_TILT) :
          clamp(
            -helicopter.vx * AUTO_HOVER_VELOCITY_DAMPING,
            -AUTO_HOVER_MAX_TILT, AUTO_HOVER_MAX_TILT
          );
      } else if (input.right !== input.left) {
        helicopter.targetAngle +=
          (input.right ? 1 : -1) * CYCLIC_TARGET_RATE * dt;
      }
      if (onSkids) {
        helicopter.targetAngle = clamp(
          helicopter.targetAngle, -SKID_PIVOT_MAX_ANGLE, SKID_PIVOT_MAX_ANGLE
        );
      }

      if (helicopter.vx <= -DIRECTION_FLIP_SPEED) helicopter.facing = -1;
      else if (helicopter.vx >= DIRECTION_FLIP_SPEED) helicopter.facing = 1;

      const angularAcceleration =
        (helicopter.targetAngle - helicopter.angle) * ATTITUDE_STIFFNESS -
        helicopter.angularVelocity * ATTITUDE_DAMPING;
      helicopter.angularVelocity += angularAcceleration * dt;
      helicopter.angularVelocity = clamp(
        helicopter.angularVelocity, -MAX_ANGULAR_RATE, MAX_ANGULAR_RATE
      );
      helicopter.angle += helicopter.angularVelocity * dt;

      const liftAcceleration = helicopter.collective * availableLiftAcceleration / massFactor;
      const verticalLift = liftAcceleration * Math.cos(helicopter.angle);
      const horizontalLift = liftAcceleration * Math.sin(helicopter.angle);

      if (helicopter.landed) {
        const landedSurface = helicopter.landedSurface ||
          (helicopter.landedAt === STATION_PAD.name ? { ...STATION_PAD, kind: "stationPad" } :
            helicopter.landedAt === RESCUE_CLEARING.name ? { ...RESCUE_CLEARING, kind: "rescueClearing" } :
              shipDeckSurface());
        holdOnSkids(landedSurface);
        if (verticalLift > GRAVITY * 1.02) {
          helicopter.landed = false;
          helicopter.landedAt = "";
          helicopter.landedSurface = null;
          helicopter.vy = surfaceVerticalVelocity(landedSurface) + 0.08;
        }
      } else {
        const dragX = HORIZONTAL_DRAG * helicopter.vx +
          HORIZONTAL_QUADRATIC_DRAG * helicopter.vx * Math.abs(helicopter.vx);
        const dragY = VERTICAL_DRAG * helicopter.vy +
          VERTICAL_QUADRATIC_DRAG * helicopter.vy * Math.abs(helicopter.vy);
        helicopter.vx += (horizontalLift + medicalWindAcceleration() - dragX) * dt;
        helicopter.vy += (verticalLift - GRAVITY - dragY) * dt;
        helicopter.vx = clamp(helicopter.vx, -MAX_HORIZONTAL_SPEED, MAX_HORIZONTAL_SPEED);
        helicopter.vy = clamp(helicopter.vy, -MAX_VERTICAL_SPEED, MAX_VERTICAL_SPEED);
        if (Math.abs(helicopter.vx) < 1 && Math.abs(helicopter.angle) <= Math.PI / 180) {
          helicopter.vx = 0;
        }
        helicopter.x += helicopter.vx * dt;
        helicopter.y += helicopter.vy * dt;
        checkContact(previousPose);
      }

      if (gameState === "playing") {
        updateSling(dt);
        updateMission(dt);
      }
      rotorPhase += (12 + helicopter.collective * 34) * dt;
      elapsed += dt;
      updateWash(dt);
    }

    function updateWash(dt) {
      for (let i = washParticles.length - 1; i >= 0; i--) {
        const p = washParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) washParticles.splice(i, 1);
      }

      const floor = Math.max(0, solidHeightAt(helicopter.x));
      const height = helicopter.y - floor;
      if (!helicopter.landed && helicopter.collective > 0.38 && height < 25 &&
          washParticles.length < 70 && Math.random() < helicopter.collective * 0.7) {
        const direction = Math.random() < 0.5 ? -1 : 1;
        washParticles.push({
          x: helicopter.x + (Math.random() - 0.5) * 4,
          y: floor + 0.2 + Math.random() * 0.8,
          vx: direction * (8 + Math.random() * 12),
          vy: 0.3 + Math.random() * 1.2,
          life: 0.35 + Math.random() * 0.5,
        });
      }
    }

    function updateCamera(dt) {
      const lead = clamp(helicopter.vx * 1.6, -100, 130);
      const targetX = helicopter.x + lead;
      const targetY = Math.max(30, helicopter.y + clamp(helicopter.vy * 0.4, -8, 10));
      const blend = 1 - Math.exp(-dt * 2.5);
      cameraX = lerp(cameraX, targetX, blend);
      cameraY = lerp(cameraY, targetY, blend);
    }

    function worldToScreenX(x) {
      return (x - cameraX) * PIXELS_PER_METRE + viewWidth * 0.46;
    }

    function worldToScreenY(y) {
      return viewHeight * 0.46 - (y - cameraY) * PIXELS_PER_METRE;
    }

    function screenToWorldX(x) {
      return (x - viewWidth * 0.46) / PIXELS_PER_METRE + cameraX;
    }

    function screenToWorldY(y) {
      return (viewHeight * 0.46 - y) / PIXELS_PER_METRE + cameraY;
    }

    function aimSpotlightAt(worldX, worldY) {
      const aimX = worldX - helicopter.x;
      const aimY = worldY - (helicopter.y - 1);
      const aimLength = Math.hypot(aimX, aimY);
      if (aimLength < 0.01) return;
      spotlightAimX = aimX / aimLength;
      spotlightAimY = aimY / aimLength;
    }

    function aimSpotlight(event) {
      const rect = canvas.getBoundingClientRect();
      const screenX = (event.clientX - rect.left) * viewWidth / rect.width;
      const screenY = (event.clientY - rect.top) * viewHeight / rect.height;
      aimSpotlightAt(screenToWorldX(screenX), screenToWorldY(screenY));
    }

    function isRescueSpotlightOnPerson() {
      if (level.mission !== "rescue") return false;
      const originX = helicopter.x;
      const originY = helicopter.y - 1;
      const directionX = spotlightAimX;
      const directionY = spotlightAimY;
      const personX = RESCUE_PERSON_X - originX;
      const personY = RESCUE_CLEARING_Y + 1 - originY;
      const alongBeam = personX * directionX + personY * directionY;
      const acrossBeam = Math.abs(personX * directionY - personY * directionX);
      return alongBeam > 0 && alongBeam <= SPOTLIGHT_RANGE &&
        acrossBeam <= 4 + alongBeam * Math.tan(SPOTLIGHT_HALF_ANGLE);
    }

    function drawSky() {
      const gradient = ctx.createLinearGradient(0, 0, 0, viewHeight);
      gradient.addColorStop(0, "#071b2d");
      gradient.addColorStop(0.48, "#426f88");
      gradient.addColorStop(0.82, "#b2ced5");
      gradient.addColorStop(1, "#d9e8e9");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      ctx.fillStyle = "rgba(226, 241, 243, 0.25)";
      ctx.beginPath();
      ctx.ellipse(viewWidth * 0.78, viewHeight * 0.16, 65, 65, 0, 0, Math.PI * 2);
      ctx.fill();

      drawCloud(viewWidth * 0.17 - cameraX * 0.018, 90, 1.05);
      drawCloud(viewWidth * 0.72 - cameraX * 0.011, 150, 0.75);
      drawCloud(viewWidth * 1.08 - cameraX * 0.015, 75, 0.9);
    }

    function drawCloud(x, y, scale) {
      x = ((x % (viewWidth + 400)) + viewWidth + 400) % (viewWidth + 400) - 200;
      ctx.fillStyle = "rgba(218, 233, 237, 0.14)";
      ctx.beginPath();
      ctx.ellipse(x, y, 85 * scale, 22 * scale, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 48 * scale, y + 5, 55 * scale, 17 * scale, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 58 * scale, y + 6, 65 * scale, 16 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMountains() {
      const seaY = worldToScreenY(0);
      const offset = -((cameraX * 0.13) % 720);
      ctx.fillStyle = "#6d8d9b";
      ctx.beginPath();
      ctx.moveTo(0, seaY);
      for (let i = -2; i < Math.ceil(viewWidth / 180) + 3; i++) {
        const x = offset + i * 180;
        const peak = seaY - 90 - ((i * 47) % 75 + 75) % 75;
        ctx.lineTo(x, seaY);
        ctx.lineTo(x + 92, peak);
        ctx.lineTo(x + 180, seaY);
      }
      ctx.lineTo(viewWidth, seaY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(219, 235, 237, 0.78)";
      ctx.beginPath();
      ctx.moveTo(0, seaY);
      for (let i = -2; i < Math.ceil(viewWidth / 180) + 3; i++) {
        const x = offset + i * 180;
        const peak = seaY - 90 - ((i * 47) % 75 + 75) % 75;
        ctx.lineTo(x + 63, peak + 45);
        ctx.lineTo(x + 92, peak);
        ctx.lineTo(x + 121, peak + 49);
      }
      ctx.lineTo(viewWidth, seaY);
      ctx.closePath();
      ctx.fill();
    }

    function drawWater() {
      const seaY = worldToScreenY(0);
      const gradient = ctx.createLinearGradient(0, seaY, 0, viewHeight);
      gradient.addColorStop(0, "#1d6177");
      gradient.addColorStop(1, "#052f47");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, seaY, viewWidth, viewHeight - seaY);

      ctx.lineWidth = 1.2;
      for (let row = 0; row < 8; row++) {
        const y = seaY + 8 + row * 19;
        ctx.strokeStyle = "rgba(183, 225, 229," + (0.24 - row * 0.015) + ")";
        ctx.beginPath();
        const phase = elapsed * (0.8 + row * 0.05) + row;
        for (let x = -20; x <= viewWidth + 20; x += 12) {
          const waveY = y + Math.sin(x * 0.032 + phase) * (1.5 + row * 0.12);
          if (x === -20) ctx.moveTo(x, waveY);
          else ctx.lineTo(x, waveY);
        }
        ctx.stroke();
      }
    }

    function drawIce() {
      if (!level.station) return;
      const startX = worldToScreenX(295);
      if (startX > viewWidth + 100) return;
      ctx.beginPath();
      ctx.moveTo(startX, viewHeight);
      for (let x = 295; x <= level.worldMaxX + 200; x += 8) {
        ctx.lineTo(worldToScreenX(x), worldToScreenY(iceHeightAt(x)));
      }
      ctx.lineTo(worldToScreenX(level.worldMaxX + 200), viewHeight);
      ctx.closePath();
      const gradient = ctx.createLinearGradient(0, worldToScreenY(7), 0, viewHeight);
      gradient.addColorStop(0, "#edf7f5");
      gradient.addColorStop(0.18, "#b9d8d8");
      gradient.addColorStop(1, "#789fa9");
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.strokeStyle = "#f7ffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 295; x <= level.worldMaxX + 200; x += 8) {
        const sx = worldToScreenX(x);
        const sy = worldToScreenY(iceHeightAt(x));
        if (x === 295) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    }

    function drawIceberg() {
      if (level.mission !== "scout") return;
      const points = [
        [555, 0], [580, 8], [610, 18], [636, 31],
        [650, SCOUT_PEAK_Y], [672, 24], [705, 13], [745, 0],
      ];
      const gradient = ctx.createLinearGradient(
        0, worldToScreenY(SCOUT_PEAK_Y), 0, worldToScreenY(-10)
      );
      gradient.addColorStop(0, "#f6ffff");
      gradient.addColorStop(0.45, "#b9dce1");
      gradient.addColorStop(1, "#4f92a8");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(worldToScreenX(points[0][0]), worldToScreenY(-12));
      for (const point of points) {
        ctx.lineTo(worldToScreenX(point[0]), worldToScreenY(point[1]));
      }
      ctx.lineTo(worldToScreenX(725), worldToScreenY(-10));
      ctx.lineTo(worldToScreenX(585), worldToScreenY(-12));
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(244,255,255,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        const x = worldToScreenX(points[i][0]);
        const y = worldToScreenY(points[i][1]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      if (!icebergScouted) {
        const left = worldToScreenX(SCOUT_X - SCOUT_RADIUS);
        const right = worldToScreenX(SCOUT_X + SCOUT_RADIUS);
        const top = worldToScreenY(SCOUT_PEAK_Y + 45);
        const bottom = worldToScreenY(SCOUT_PEAK_Y + 15);
        ctx.save();
        ctx.setLineDash([9, 7]);
        ctx.strokeStyle = "rgba(67,213,205,0.85)";
        ctx.fillStyle = "rgba(67,213,205,0.08)";
        ctx.lineWidth = 2;
        ctx.fillRect(left, top, right - left, bottom - top);
        ctx.strokeRect(left, top, right - left, bottom - top);
        if (isScoutHoverValid()) {
          const barWidth = Math.min(150, right - left - 16);
          const barX = left + (right - left - barWidth) / 2;
          const barY = top - 17;
          const progress = clamp(scoutTimer / SCOUT_TIME, 0, 1);
          ctx.setLineDash([]);
          ctx.fillStyle = "rgba(5,20,29,0.8)";
          ctx.fillRect(barX - 2, barY - 2, barWidth + 4, 12);
          ctx.fillStyle = "rgba(255,255,255,0.18)";
          ctx.fillRect(barX, barY, barWidth, 8);
          ctx.fillStyle = "#65e4b0";
          ctx.fillRect(barX, barY, barWidth * progress, 8);
          ctx.strokeStyle = "rgba(225,255,244,0.85)";
          ctx.lineWidth = 1;
          ctx.strokeRect(barX, barY, barWidth, 8);
        }
        ctx.restore();
      }
    }

    function drawSummitMountain() {
      if (level.mission !== "summit") return;
      ctx.beginPath();
      ctx.moveTo(worldToScreenX(SUMMIT_MOUNTAIN_POINTS[0][0]), worldToScreenY(-12));
      for (const point of SUMMIT_MOUNTAIN_POINTS) {
        ctx.lineTo(worldToScreenX(point[0]), worldToScreenY(point[1]));
      }
      ctx.lineTo(worldToScreenX(SUMMIT_MOUNTAIN_POINTS[SUMMIT_MOUNTAIN_POINTS.length - 1][0]), worldToScreenY(-12));
      ctx.closePath();
      const mountainGradient = ctx.createLinearGradient(0, worldToScreenY(SUMMIT_PEAK.y), 0, worldToScreenY(-10));
      mountainGradient.addColorStop(0, "#eef5f4");
      mountainGradient.addColorStop(0.22, "#9eb8be");
      mountainGradient.addColorStop(0.6, "#506f78");
      mountainGradient.addColorStop(1, "#263f49");
      ctx.fillStyle = mountainGradient;
      ctx.fill();
      ctx.strokeStyle = "rgba(244,255,255,0.88)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < SUMMIT_MOUNTAIN_POINTS.length; i++) {
        const point = SUMMIT_MOUNTAIN_POINTS[i];
        if (i === 0) ctx.moveTo(worldToScreenX(point[0]), worldToScreenY(point[1]));
        else ctx.lineTo(worldToScreenX(point[0]), worldToScreenY(point[1]));
      }
      ctx.stroke();

      const ledgeX = worldToScreenX(SUMMIT_LEDGE.x1);
      const ledgeWidth = (SUMMIT_LEDGE.x2 - SUMMIT_LEDGE.x1) * PIXELS_PER_METRE;
      const ledgeY = worldToScreenY(SUMMIT_LEDGE.y);
      ctx.fillStyle = "rgba(255,216,74,0.18)";
      ctx.fillRect(ledgeX, ledgeY - 4, ledgeWidth, 8);
      ctx.strokeStyle = "#ffd84a";
      ctx.lineWidth = 2;
      ctx.strokeRect(ledgeX, ledgeY - 5, ledgeWidth, 10);

      if (engineersDropped && !antennaInstalled) {
        const peakX = worldToScreenX(SUMMIT_PEAK.x1);
        const peakWidth = (SUMMIT_PEAK.x2 - SUMMIT_PEAK.x1) * PIXELS_PER_METRE;
        const peakY = worldToScreenY(SUMMIT_PEAK.y);
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = "#ffdb5a";
        ctx.strokeRect(peakX, peakY - 5, peakWidth, 10);
        ctx.restore();
        ctx.fillStyle = "#ffdb5a";
        ctx.font = "bold 11px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("REPEATER", peakX + peakWidth / 2, peakY - 10);
      }

      if (engineersDropped && !engineersAboard) {
        drawExpeditioner(SUMMIT_LEDGE.x1 + 11, SUMMIT_LEDGE.y + 0.2, 0);
        drawExpeditioner(SUMMIT_LEDGE.x1 + 21, SUMMIT_LEDGE.y + 0.2, 1);
      }

      if (antennaInstalled) drawSummitAntenna();
    }

    function drawSummitAntenna() {
      const baseX = worldToScreenX((SUMMIT_PEAK.x1 + SUMMIT_PEAK.x2) / 2);
      const baseY = worldToScreenY(SUMMIT_PEAK.y);
      ctx.fillStyle = "#9fc587";
      ctx.fillRect(baseX - 15, baseY - 15, 30, 15);
      ctx.fillStyle = "#345a4d";
      ctx.fillRect(baseX - 12, baseY - 12, 9, 8);
      ctx.fillStyle = "#dce8d0";
      ctx.fillRect(baseX + 1, baseY - 12, 10, 8);
      ctx.strokeStyle = "#dbe2df";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY - 15);
      ctx.lineTo(baseX, baseY - 76);
      ctx.moveTo(baseX - 8, baseY - 42);
      ctx.lineTo(baseX + 8, baseY - 42);
      ctx.moveTo(baseX - 8, baseY - 42);
      ctx.lineTo(baseX, baseY - 15);
      ctx.moveTo(baseX + 8, baseY - 42);
      ctx.lineTo(baseX, baseY - 15);
      ctx.stroke();
      ctx.strokeStyle = "rgba(30,38,42,0.95)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY - 70);
      ctx.lineTo(baseX - 21, baseY - 3);
      ctx.moveTo(baseX, baseY - 70);
      ctx.lineTo(baseX + 21, baseY - 3);
      ctx.stroke();
      ctx.strokeStyle = "#f2e5ad";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY - 58);
      ctx.lineTo(baseX + 18, baseY - 58);
      ctx.moveTo(baseX, baseY - 35);
      ctx.lineTo(baseX + 16, baseY - 35);
      ctx.stroke();
    }

    function drawNuyina() {
      if (!nuyinaImage.complete || !nuyinaImage.naturalWidth) return;
      const width = NUYINA_SVG_WIDTH * PIXELS_PER_METRE;
      const height = NUYINA_SVG_HEIGHT * PIXELS_PER_METRE;
      ctx.drawImage(
        nuyinaImage,
        worldToScreenX(NUYINA_WORLD_X),
        worldToScreenY(shipSwellOffset() + NUYINA_ARTWORK_Y_OFFSET) - height,
        width, height
      );
    }

    function drawStation() {
      if (!level.station) return;
      const padX = worldToScreenX(STATION_PAD.x1);
      const padY = worldToScreenY(STATION_PAD.y);
      const padWidth = (STATION_PAD.x2 - STATION_PAD.x1) * PIXELS_PER_METRE;

      ctx.fillStyle = "#394c50";
      ctx.fillRect(padX, padY, padWidth, 7);
      ctx.strokeStyle = "#ffd84a";
      ctx.lineWidth = 3;
      ctx.strokeRect(padX + 3, padY - 1, padWidth - 6, 6);
      ctx.fillStyle = "#ffd84a";
      ctx.font = "bold 24px Arial";
      ctx.textAlign = "center";
      ctx.fillText("H", padX + padWidth / 2, padY - 8);

      for (let i = 0; i < BUILDINGS.length; i++) {
        const b = BUILDINGS[i];
        const x = worldToScreenX(b.x1);
        const y = worldToScreenY(b.y2);
        const w = (b.x2 - b.x1) * PIXELS_PER_METRE;
        const h = (b.y2 - b.y1) * PIXELS_PER_METRE;
        ctx.fillStyle = i === 1 ? "#e95b2c" : "#d84a2a";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#f1e8c9";
        for (let wx = 10; wx < w - 6; wx += 24) {
          ctx.fillRect(x + wx, y + 18, 9, 10);
        }
        ctx.fillStyle = "rgba(255,255,255,0.72)";
        ctx.beginPath();
        ctx.moveTo(x - 5, y);
        ctx.lineTo(x + w / 2, y - 15);
        ctx.lineTo(x + w + 5, y);
        ctx.closePath();
        ctx.fill();
      }

      const tower = BUILDINGS[2];
      const tx = worldToScreenX((tower.x1 + tower.x2) / 2);
      const ty = worldToScreenY(tower.y2);
      ctx.strokeStyle = "#e7ece4";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx, ty - 45);
      ctx.moveTo(tx - 16, ty - 25);
      ctx.lineTo(tx + 16, ty - 25);
      ctx.stroke();

      ctx.fillStyle = "rgba(7, 25, 40, 0.7)";
      ctx.font = "bold 15px Trebuchet MS";
      ctx.textAlign = "center";
      ctx.fillText("AURORA STATION", worldToScreenX(675), worldToScreenY(42));

      if (level.mission === "sling") {
        const ground = cargoGroundY();
        const x1 = worldToScreenX(CARGO_ZONE.x1);
        const x2 = worldToScreenX(CARGO_ZONE.x2);
        const y = worldToScreenY(ground);
        ctx.fillStyle = "rgba(255,216,74,0.18)";
        ctx.fillRect(x1, y - 5, x2 - x1, 10);
        ctx.strokeStyle = "#ffd84a";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(x1, y - 6, x2 - x1, 12);
        ctx.setLineDash([]);
        ctx.fillStyle = "#ffd84a";
        ctx.font = "bold 12px Trebuchet MS";
        ctx.fillText("CARGO", (x1 + x2) / 2, y - 13);
      }

      if (level.mission === "passengers" && passengersAboard === 0) {
        for (let i = 0; i < 6; i++) {
          drawExpeditioner(STATION_PAD.x2 + 18 + i * 4.5, STATION_PAD_Y + 0.2, i % 2);
        }
      }

      if (level.mission === "medical" && !patientAboard) {
        drawExpeditioner((STATION_PAD.x1 + STATION_PAD.x2) / 2, STATION_PAD_Y + 0.2, 1);
      }
    }

    function drawExpeditioner(x, groundY, variant) {
      const sx = worldToScreenX(x);
      const sy = worldToScreenY(groundY);
      ctx.fillStyle = variant ? "#f2c94c" : "#ef5b2b";
      ctx.beginPath();
      ctx.arc(sx, sy - 10, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(sx - 3, sy - 7, 6, 9);
      ctx.strokeStyle = "#243740";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sx - 1.5, sy + 1);
      ctx.lineTo(sx - 2.5, sy + 6);
      ctx.moveTo(sx + 1.5, sy + 1);
      ctx.lineTo(sx + 2.5, sy + 6);
      ctx.stroke();
    }

    function drawCagePallet(item, delivered) {
      if (!item) return;
      const left = worldToScreenX(item.x - PALLET_WIDTH / 2);
      const top = worldToScreenY(item.y);
      const width = PALLET_WIDTH * PIXELS_PER_METRE;
      const height = PALLET_HEIGHT * PIXELS_PER_METRE;
      if (level.mission === "summit") {
        ctx.fillStyle = "#9fc587";
        ctx.fillRect(left, top, width, height);
        ctx.strokeStyle = "#30454a";
        ctx.lineWidth = 2;
        ctx.strokeRect(left, top, width, height);
        ctx.fillStyle = "#315c78";
        ctx.fillRect(left + 3, top + 3, width * 0.3, height - 6);
        ctx.strokeStyle = "#e5eee6";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left + width * 0.68, top + height - 3);
        ctx.lineTo(left + width * 0.68, top - height * 1.25);
        ctx.moveTo(left + width * 0.68 - 6, top - height * 0.62);
        ctx.lineTo(left + width * 0.68 + 6, top - height * 0.62);
        ctx.stroke();
        return;
      }
      ctx.fillStyle = delivered ? "rgba(208,164,83,0.9)" : "#bd8746";
      ctx.fillRect(left, top, width, height);
      ctx.strokeStyle = "#39454a";
      ctx.lineWidth = 2;
      ctx.strokeRect(left, top, width, height);
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(left + width, top + height);
      ctx.moveTo(left + width, top);
      ctx.lineTo(left, top + height);
      ctx.moveTo(left + width / 2, top);
      ctx.lineTo(left + width / 2, top + height);
      ctx.stroke();
      ctx.fillStyle = "#704b2e";
      ctx.fillRect(left - 2, top + height, width + 4, 3);
    }

    function drawSling() {
      if (!usesSlingLoad()) return;
      for (const delivered of deliveredPallets) drawCagePallet(delivered, true);
      if (pallet) drawCagePallet(pallet, false);
      if (cableLength <= 0.02) return;
      const anchor = slingHardpoint();
      const endX = loadAttached() ? pallet.x : anchor.x;
      const endY = loadAttached() ? pallet.y : anchor.y - cableLength;
      ctx.strokeStyle = "#202b2f";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(worldToScreenX(anchor.x), worldToScreenY(anchor.y));
      ctx.lineTo(worldToScreenX(endX), worldToScreenY(endY));
      ctx.stroke();
      if (!loadAttached()) {
        ctx.fillStyle = "#f2d04d";
        ctx.beginPath();
        ctx.arc(worldToScreenX(endX), worldToScreenY(endY), 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawWash() {
      ctx.lineCap = "round";
      for (const particle of washParticles) {
        const alpha = clamp(particle.life * 1.6, 0, 0.5);
        ctx.strokeStyle = "rgba(225,244,245," + alpha + ")";
        ctx.lineWidth = 1.5;
        const x = worldToScreenX(particle.x);
        const y = worldToScreenY(particle.y);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - particle.vx * 0.8, y + 1);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    }

    function drawShadow() {
      const floor = Math.max(0, solidHeightAt(helicopter.x));
      const height = helicopter.y - floor;
      if (height < 0 || height > 80) return;
      const alpha = clamp(0.32 - height / 280, 0.04, 0.3);
      const width = 54 + height * 0.7;
      ctx.fillStyle = "rgba(4,18,25," + alpha + ")";
      ctx.beginPath();
      ctx.ellipse(
        worldToScreenX(helicopter.x),
        worldToScreenY(floor) + 2,
        width,
        6 + height * 0.05,
        0, 0, Math.PI * 2
      );
      ctx.fill();
    }

    function drawHelicopter() {
      const x = worldToScreenX(helicopter.x);
      const y = worldToScreenY(helicopter.y);
      const s = PIXELS_PER_METRE;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(helicopter.angle);
      ctx.scale(s * helicopter.facing, s);

      ctx.strokeStyle = "#17272e";
      ctx.lineWidth = 0.22;
      ctx.lineCap = "round";

      // Long, lightly upswept Squirrel skids and their exposed cross-tube frame.
      ctx.beginPath();
      ctx.moveTo(-3.55, 2.15);
      ctx.lineTo(3.5, 2.15);
      ctx.quadraticCurveTo(4.05, 2.15, 4.3, 1.72);
      ctx.moveTo(-3.2, 1.93);
      ctx.lineTo(3.65, 1.93);
      ctx.moveTo(-2.6, 2.08);
      ctx.lineTo(-1.95, 1.05);
      ctx.moveTo(-1.25, 2.08);
      ctx.lineTo(-0.9, 1.2);
      ctx.moveTo(1.85, 2.08);
      ctx.lineTo(1.55, 1.12);
      ctx.moveTo(3.05, 2.05);
      ctx.lineTo(2.45, 1.25);
      ctx.stroke();

      // Slender tail boom, swept fin and tailplane.
      const tailGradient = ctx.createLinearGradient(-8.2, 0, -1.2, 0);
      tailGradient.addColorStop(0, "#9d1728");
      tailGradient.addColorStop(0.55, "#bd1c31");
      tailGradient.addColorStop(1, "#d52a38");
      ctx.fillStyle = tailGradient;
      ctx.beginPath();
      ctx.moveTo(-1.65, -0.62);
      ctx.lineTo(-8.15, -1.08);
      ctx.lineTo(-7.92, -0.15);
      ctx.lineTo(-1.45, 0.58);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#b51b2e";
      ctx.beginPath();
      ctx.moveTo(-7.95, -0.72);
      ctx.lineTo(-7.45, -3.35);
      ctx.lineTo(-6.75, -3.15);
      ctx.lineTo(-6.85, -0.55);
      ctx.closePath();

    function clipSpotlightPolygon(points) {
      const clipEdge = (source, axis, boundary, keepGreater) => {
        const clipped = [];
        for (let i = 0; i < source.length; i++) {
          const previous = source[(i + source.length - 1) % source.length];
          const current = source[i];
          const previousInside = keepGreater ? previous[axis] >= boundary : previous[axis] <= boundary;
          const currentInside = keepGreater ? current[axis] >= boundary : current[axis] <= boundary;
          if (previousInside !== currentInside) {
            const t = (boundary - previous[axis]) / (current[axis] - previous[axis]);
            clipped.push({
              x: previous.x + (current.x - previous.x) * t,
              y: previous.y + (current.y - previous.y) * t,
            });
          }
          if (currentInside) clipped.push(current);
        }
        return clipped;
      };
      let clipped = clipEdge(points, "x", 0, true);
      clipped = clipEdge(clipped, "x", viewWidth, false);
      clipped = clipEdge(clipped, "y", 0, true);
      return clipEdge(clipped, "y", viewHeight, false);
    }

    function spotlightGeometry() {
      const originX = worldToScreenX(helicopter.x);
      const originY = worldToScreenY(helicopter.y - 1);
      const directionX = spotlightAimX;
      const directionY = -spotlightAimY;
      const edgeDistances = [];
      if (directionX > 0) edgeDistances.push((viewWidth - originX) / directionX);
      else if (directionX < 0) edgeDistances.push(-originX / directionX);
      if (directionY > 0) edgeDistances.push((viewHeight - originY) / directionY);
      else if (directionY < 0) edgeDistances.push(-originY / directionY);
      const beamLength = Math.max(1, Math.min(...edgeDistances.filter(distance => distance > 0)));
      const endX = originX + directionX * beamLength;
      const endY = originY + directionY * beamLength;
      const perpendicularX = -directionY;
      const perpendicularY = directionX;
      const coneLength = Math.hypot(viewWidth, viewHeight) * 2;
      const coneHalfWidth = Math.tan(SPOTLIGHT_HALF_ANGLE) * coneLength;
      const farX = originX + directionX * coneLength;
      const farY = originY + directionY * coneLength;
      const polygon = clipSpotlightPolygon([
        { x: originX, y: originY },
        { x: farX + perpendicularX * coneHalfWidth, y: farY + perpendicularY * coneHalfWidth },
        { x: farX - perpendicularX * coneHalfWidth, y: farY - perpendicularY * coneHalfWidth },
      ]);
      return { originX, originY, endX, endY, polygon };
    }

    function drawSpotlightConePath(beam) {
      if (!beam.polygon.length) return;
      ctx.moveTo(beam.polygon[0].x, beam.polygon[0].y);
      for (let i = 1; i < beam.polygon.length; i++) {
        ctx.lineTo(beam.polygon[i].x, beam.polygon[i].y);
      }
      ctx.closePath();
    }

    function drawNightVeil() {
      if (level.mission !== "rescue") return;
      const beam = spotlightGeometry();
      ctx.fillStyle = "rgba(1, 8, 22, 0.82)";

      ctx.rect(0, 0, viewWidth, viewHeight);
      drawSpotlightConePath(beam);
      ctx.fill("evenodd");

      ctx.fillStyle = "rgba(224, 239, 255, 0.75)";
      for (let i = 0; i < 34; i++) {
        const x = (i * 83 + 41) % viewWidth;
        const y = 25 + (i * 47) % Math.max(55, viewHeight * 0.42);
        ctx.globalAlpha = 0.35 + (i % 3) * 0.16;
        ctx.fillRect(x, y, 1.2, 1.2);

      ctx.globalAlpha = 1;
    }

    function drawSpotlight() {
      if (level.mission !== "rescue") return;
      const beam = spotlightGeometry();
      const gradient = ctx.createLinearGradient(beam.originX, beam.originY, beam.endX, beam.endY);
      gradient.addColorStop(0, "rgba(255, 232, 142, 0.32)");
      gradient.addColorStop(0.45, "rgba(214, 176, 72, 0.14)");
      gradient.addColorStop(0.9, "rgba(0, 0, 0, 0.0)");
      ctx.save();
      ctx.fillStyle = gradient;
      ctx.beginPath();
      drawSpotlightConePath(beam);
      ctx.fill();
      ctx.restore();
    }

    function updateAndDrawSnow(realDt) {
      ctx.fillStyle = "#fff";
      for (const flake of snow) {
        flake.x += (flake.drift + medicalWindSpeed() * PIXELS_PER_METRE) * realDt;
        flake.y += flake.speed * realDt;
        if (flake.y > viewHeight + 4) {
          flake.y = -4;
          flake.x = Math.random() * viewWidth;
        }
        if (flake.x > viewWidth + 4) flake.x = -4;
        ctx.globalAlpha = flake.alpha;
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

      if (level.mission === "scout") {
        return icebergScouted ?

      if (level.mission === "passengers") {
        return "Deliver " + passengersAboard + " expeditioners to Aurora Station";
      }
      if (level.mission === "rescue") {
        if (rescueAboard) return "Return the expeditioner to Aurora Station";
        if (rescueLocated) return "Land beside the located expeditioner";
        return "Search east of station with the spotlight";
      }
      if (level.mission === "medical") return patientAboard ?
        "Return the patient to Nuyina for treatment" : "Land on Aurora Station helipad to board the patient";
      if (level.mission === "summit") {
        if (!engineersDropped) return "Land on the mountain ledge to deploy two engineers";
        if (!antennaInstalled) return loadAttached() ?
          "Place the radio repeater precisely on the summit" : "Return to Nuyina's cargo deck and collect the radio repeater";
        if (!engineersAboard) return "Land on the ledge and collect the engineers";
        return "Return the engineers to Nuyina";
      }
      if (deliveries >= 3) return "Return to Nuyina and land";
      if (loadAttached()) return "Place cage " + (deliveries + 1) + " in the station cargo zone";

    function activeObjective() {
      if (level.mission === "scout") {
        return icebergScouted ?
          { x: (SHIP_DECK.x1 + SHIP_DECK.x2) / 2, y: shipDeckY() } :
          { x: SCOUT_X, y: SCOUT_PEAK_Y + 28 };
      }
      if (level.mission === "passengers") {
        return { x: (STATION_PAD.x1 + STATION_PAD.x2) / 2, y: STATION_PAD.y };
      }
      if (level.mission === "rescue") {
        if (rescueAboard) return { x: (STATION_PAD.x1 + STATION_PAD.x2) / 2, y: STATION_PAD.y };
        return rescueLocated ? { x: RESCUE_PERSON_X, y: RESCUE_CLEARING_Y } : null;
      }
      if (level.mission === "medical") {
        return patientAboard ?
          { x: (SHIP_DECK.x1 + SHIP_DECK.x2) / 2, y: shipDeckY() } :
          { x: (STATION_PAD.x1 + STATION_PAD.x2) / 2, y: STATION_PAD.y };
      }
      if (level.mission === "summit") {
        if (!engineersDropped || (antennaInstalled && !engineersAboard)) {
          return { x: (SUMMIT_LEDGE.x1 + SUMMIT_LEDGE.x2) / 2, y: SUMMIT_LEDGE.y };
        }
        if (!antennaInstalled) {
          return loadAttached() ?
            { x: (SUMMIT_PEAK.x1 + SUMMIT_PEAK.x2) / 2, y: SUMMIT_PEAK.y } :
            { x: PALLET_PICKUP_X, y: shipCargoPadY() + PALLET_HEIGHT };
        }
        return { x: (SHIP_DECK.x1 + SHIP_DECK.x2) / 2, y: shipDeckY() };
      }
      if (deliveries >= 3) {
        return { x: (SHIP_DECK.x1 + SHIP_DECK.x2) / 2, y: shipDeckY() };
      }
      if (loadAttached()) {
        return {
          x: (CARGO_ZONE.x1 + CARGO_ZONE.x2) / 2,
          y: cargoGroundY(),
        };
      }
      return pallet ?
        { x: pallet.x, y: pallet.y } :
        { x: PALLET_PICKUP_X, y: SHIP_CARGO_PAD.y + PALLET_HEIGHT };
    }

    function drawObjectivePointer() {
      if (gameState !== "playing") return;
      const target = activeObjective();
      if (!target) return;
      const sx = worldToScreenX(target.x);
      const sy = worldToScreenY(target.y);
      const margin = 56;
      if (sx > margin && sx < viewWidth - margin &&
          sy > margin && sy < viewHeight - margin) return;

      const centreX = viewWidth / 2;
      const centreY = viewHeight / 2;
      const dx = sx - centreX;
      const dy = sy - centreY;
      const scale = Math.min(
        (centreX - margin) / Math.abs(dx || 1e-9),
        (centreY - margin) / Math.abs(dy || 1e-9)
      );
      const edgeX = centreX + dx * scale;
      const edgeY = centreY + dy * scale;
      ctx.save();
      ctx.translate(edgeX, edgeY);
      ctx.rotate(Math.atan2(dy, dx));
      ctx.fillStyle = "#ffd400";
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(-6, -9);
      ctx.lineTo(-6, 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      const distance = Math.hypot(target.x - helicopter.x, target.y - helicopter.y);
      const label = formatObjectiveDistance(distance);
      ctx.font = "bold 14px Trebuchet MS";
      ctx.fillStyle = "#ffd400";
      ctx.textAlign = "center";
      ctx.fillText(label, edgeX, edgeY + 26);
    }

    function formatObjectiveDistance(distance) {
      return distance >= 1000 ?
        (distance / 1000).toFixed(1) + " km" :
        Math.round(distance) + " m";

    function drawCrash() {
